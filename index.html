   ce bonus. Chaque 4+ est une réussite, chaque 6 relance un dé de plus, qui compte à
   son tour. Un bonus de 0 lance donc bien un dé, et non aucun. */
function testSkill(i){const a=actors[selected];if(!a)return;
 const jet=skillRoll(competenceDe(a,i),d6);
 rollOnBoard(jet.des.slice(0,40).map(v=>[v,0]),a,a);
 log(nomNum(a)+' · '+skillNames[i]+' : '+jet.reussites+' réussite(s), '+jet.des.length+' dés avec relances.'
  +(jet.reste?' Limite de sécurité atteinte : relances restantes '+jet.reste+'.':''),{dice:true})}
/* Une frappe, sur une cible. Isolée parce qu'une même attaque peut en toucher plusieurs :
   Double attaque en autorise deux ou davantage, et chacune reçoit son propre jet. Renvoie
   vrai si le coup est parti — un coup empêché ne dépense pas l'Action. */
function frappe(a,b,rang,pool,bonus){
 const r0=reachTo(a,b,rang);
 if(r0&&!r0.ok){log(r0.ranged?nomNum(a)+' n’a pas de ligne de vue vers '+nomNum(b)+' ('+r0.text.replace('ligne de vue bloquée par ','obstacle : ')+').'
   :r0.mur?'Un mur sépare '+nomNum(a)+' de '+nomNum(b)+' : le coup ne peut pas porter.'
   :nomNum(b)+' est hors du rayon de contact de '+nomNum(a)+'.');return false}
 const tous=[];pool.forEach((n,c)=>{for(let i=0;i<n;i++)tous.push([d6(),c])});
 /* Invulnérabilité : la cible écarte les dés dont elle est devenue insensible. Sans un seul
    dé qui l'atteigne, le coup ne porte pas — il ne se résout même pas. */
 const {gardes:dice,ecartes}=desRecus(b,tous);
 if(!dice.length){floatNumber(b,'Immunisé','nul');
  logAttaque(a,b,(activeAttack(a).logos||[])[0]||'',ecartes.length+' dé'+(ecartes.length>1?'s':'')+' sans effet.',null,ditEcartes(ecartes));
  return true}
 // Mauvais Sort : qui cible le porteur relance son meilleur dé, avant tout calcul.
 const sort=porteEffet(talentsCodes(b),'mauvaissort')?mauvaisSort(dice,d6):null;
 // Destructeur ne joue qu'avec une arme, et au contact : ni arc, ni attaque de fiche.
 const arme=activeAttack(a),destructeur=!!arme.gear&&(arme.range||'contact')==='contact'&&porteEffet(talentsCodes(a),'destructeur');
 // Brise : contre une cible qui porte l'affection réglée, la DEF du porteur ne compte plus.
 const ouverte=briseLaGarde(talentsCodes(a),b);
 const def=hasState(b,'Au sol')||ouverte?0:defOf(b);
 // Solidité : la DEF de la cible retranche aussi les dés Lourds, qui l'ignorent chez tout autre.
 const solide=porteEffet(talentsCodes(b),'solidite');
 let r;try{r=resolveAttack({dice,def,dmg:bonus,round,criticalColor:criticalColor(pool),roll:d6,faille:hasState(a,'Faille'),bleed:bleedOf(b),
  doublesCritiques:destructeur,solidite:solide})}catch(e){log(e.message);return false}
 let damage=r.damage,blocked=false;
 if(!r.failed&&r.hit&&hasState(b,'Blindage')){damage=0;blocked=true;setState(b,'Blindage',false)}
 /* Rempart puis Garde rapprochée : le coup passe d'abord par ceux qui s'interposent, et
    la cible n'encaisse que ce qu'ils ont laissé. */
 const partage=r.failed||blocked?null:degatsRepartis(b,damage);
 const couverts=partage?partage.garde:[],remparts=partage?partage.rempart:[];
 if(partage)damage=partage.reste;
 const lost=Math.min(b.hp,damage);b.hp=Math.max(0,b.hp-damage);if(b.hp===0)setState(b,'Coma',true);
 // Débordement : la cible tombée n'a pas tout encaissé, le reste va au suivant.
 const deborde=b.hp===0&&damage>lost?debordement(a,b,damage-lost,rangeOf(a)):null;
 /* Ce que l'arme inflige se pose sur qui elle a touché, et seulement si des points de vie
    sont vraiment partis : un échec, un blindage consommé ou un coup à zéro ne pose rien. */
 const poses=[],absorbes=[],immunises=[];
 /* Ignition : la braise reçue d'un orbe part avec le premier coup au contact, en plus de ce
    que l'arme inflige, puis s'éteint — qu'elle ait pris ou non. */
 const charge=(rangeOf(a)==='distance'?'':a.ignition)||'';
 const afflictions=[...(activeAttack(a).etats||[]),...(charge?[charge]:[])];
 if(!r.failed&&!blocked&&lost>0){afflictions.forEach(e=>{const issue=infligeEtat(b,e);
  if(issue===true)poses.push(e);else if(issue==='onde')absorbes.push(e);else if(issue==='immunise')immunises.push(e)});
  if(charge)a.ignition=''}
 // Le chiffre qui monte dit les dégâts infligés, en excédent compris : 22 sur 10 PV reste −22.
 floatNumber(b,couverts.length&&!damage?'Garde':blocked?'Blindage':r.failed?'Échec':damage?'−'+damage:'0',(couverts.length&&!damage)||blocked||r.failed||!damage?'nul':'perte');
 poseJet({dice:r.dice,origine:dice.length,faille:r.failleFace,def,bonus:r.failed||blocked?0:bonus,reduction:r.failed||blocked?0:r.reduction,solidite:solide},a,b);
 const corps=r.failed?'Échec (double 1).':blocked?'Blindage consommé.':(r.critical?'Critique ! ':'')+r.damage+' Dégâts'+(poses.length?' + '+poses.join(' + '):'')+'.';
 const suite=ditEcartes(ecartes)+(ouverte?' Brise : la DEF ne compte pas.':'')+(sort?' Mauvais Sort : le '+sort.avant+' relancé donne '+sort.apres+'.':'')+(r.failleFace!==null?' Faille sur '+r.failleFace+'.':'')+(absorbes.length?' Onde consumée : '+absorbes.join(', ')+' ignoré.':'')+(immunises.length?' Invulnérable : '+immunises.join(', ')+' sans effet.':'')+(couverts.length?' Garde rapprochée : '+couverts.join(', ')
  /* « À sa place » ne se dit que si le porteur n'a rien pris : dès qu'un reliquat lui
     revient, les sbires n'ont fait qu'encaisser d'abord. */
  +(couverts.length>1?' encaissent':' encaisse')+(lost>0?' d’abord.':' à sa place.'):'')+(remparts.length?' Rempart : '+remparts.join(', ')+' prend la moitié.':'')+(b.hp===0?' 💀':'')+(deborde?' Débordement : '+deborde+'.':'');
 logAttaque(a,b,(activeAttack(a).logos||[])[0]||'',corps,r.failed||blocked?null:{dice:r.dice,origine:dice.length,bonus,saignee:r.bleed,faille:r.failleFace,reduction:r.reduction,total:r.damage},suite);
 return true}
let tirEnVol=false;
/* « vises » impose les cibles — celle qu'une Provocation vient d'amener — et « apres »
   est rappelé une fois les dégâts tombés, avec les cibles, les coups partis et les tués :
   c'est ainsi qu'un talent bâtit sur une attaque sans la réécrire. */
function attack(opts={}){
 if(tirEnVol)return;
 saveChecks();savePool();const a=actors[selected];if(!a)return;
 if(!controlled(selected)||!alive(a)||hasState(a,'Au sol'))return;
 if(actionPrise(a)){log(nomNum(a)+' a déjà dépensé son Action ce tour.',{local:true});return}
 /* Sans attaque, aucun coup ne part — pas même en cliquant la cible déjà visée. Un
    aventurier frappe de ses armes : désarmé, il n'a rien à lancer. */
 if(!attackChoices(a,items()).length){
  log(nomNum(a)+(a.hero?' n’a aucune arme équipée : aucune attaque ne part.':' n’a aucune attaque.'),{local:true});return}
 if(blinded(a)&&rangeOf(a)==='distance'){log(nomNum(a)+' est aveugle : ni arme à distance ni sort.',{local:true});return}
 const pool=poolOf(a);
 if(pool[4]){log('Retire les dés verts de la réserve pour attaquer : ce sont des soins.',{local:true});return}
 if(!pool.some(n=>n>0)){log('Équipe une arme ou donne des dés à l’attaque de la fiche.',{local:true});return}
 /* Les cibles du coup : celles qu'on a désignées et qui sont encore à portée. Aucune ?
    L'attaque prend ce qui s'impose — au contact, en vue — sans rien retenir : on se
    promène sans cible, et chaque coup part sur qui est là. Une désignation devenue hors
    de portée cède la place et s'efface, pour que la flèche ne mente pas. */
 const portee=rangeOf(a)==='distance'?'distance':'contact';
 const designees=ciblesDe(a).filter(j=>actors[j]&&alive(actors[j])&&actors[j].hero!==a.hero);
 let vises;
 /* Une cible imposée ne se remplace pas : hors de portée, le coup ne part pas, et l'Action
    est dépensée avec elle — l'adversaire, lui, a bien bougé. */
 if(opts.vises){vises=ciblesAtteignables(a,opts.vises,portee);
  if(!vises.length){const b=actors[opts.vises[0]];log((b?nomNum(b):'La cible')+' reste hors de portée de '+nomNum(a)+' : le coup ne part pas.',{local:true});
   depensePoint(a,'action');afterAction(a);render();return}}
 else{vises=ciblesAtteignables(a,designees,portee);
  if(!vises.length){vises=cibleAutomatique(a,portee);if(designees.length){poseCibles(a,[]);render()}}}
 if(!vises.length){log(nomNum(a)+' n’a aucune cible à portée.',{local:true});return}
 const bonus=hasState(a,'Affaibli')||activeAttack(a).useOwnDamage===false?0:degatsDe(a);
 // Qui touche le tireur au moment du tir : ils frapperont une fois les flèches tombées.
 const contacts=rangeOf(a)==='distance'?contactsDe(a):[];
 const frapper=()=>{let partis=0;
  const vivants=vises.filter(j=>alive(actors[j]));
  jetsEnCours=[];
  try{for(const j of vises)if(frappe(a,actors[j],j,pool,bonus))partis++}
  finally{const jets=jetsEnCours;jetsEnCours=null;if(jets&&jets.length)rollOnBoard(jets,a,null)}
  if(partis){depensePoint(a,'action');afterAction(a);opportuniteAuTir(a,contacts,'tir')}
  if(opts.apres)opts.apres({vises,partis,tues:vivants.filter(j=>!alive(actors[j]))});
  render()};
 /* Au contact, un balayage d'air part vers chaque cible à portée, et le coup tombe au bout
    du geste. L'Action se prend au départ, pour qu'un second clic pendant le geste ne frappe
    pas deux fois. */
 if(rangeOf(a)!=='distance'&&typeof volBalayage==='function'){
  const proches=vises.filter(j=>{const r0=reachTo(a,actors[j],j);return !r0||r0.ok});
  let duree=0;proches.forEach(j=>{duree=Math.max(duree,volBalayage(a,actors[j]));if(typeof diffuserEffet==='function')diffuserEffet('balayage',a,actors[j],null)});
  if(duree>0){tirEnVol=true;depensePoint(a,'action');if(actors[selected]===a)$('action').checked=pointsRestants(a,'action')<=0;render();
   setTimeout(()=>{tirEnVol=false;frapper();scheduleSave()},duree);return}}
 /* À distance, le souffle du tir part vers chaque cible en vue et les dégâts tombent à
    l'arrivée. L'Action se prend au départ, pour qu'un second clic pendant le vol ne tire
    pas deux fois. */
 if(rangeOf(a)==='distance'&&typeof volFleche==='function'){
  const envue=vises.filter(j=>{const r0=reachTo(a,actors[j],j);return !r0||r0.ok});
  let duree=0;envue.forEach(j=>{duree=Math.max(duree,volFleche(a,actors[j]));if(typeof diffuserEffet==='function')diffuserEffet('fleche',a,actors[j],null)});
  if(duree>0){tirEnVol=true;depensePoint(a,'action');if(actors[selected]===a)$('action').checked=pointsRestants(a,'action')<=0;render();
   setTimeout(()=>{tirEnVol=false;frapper();scheduleSave()},duree);return}}
 frapper();
}

function hpDe(a,delta){const avant=a.hp;a.hp=Math.max(0,Math.min(a.max,a.hp+delta));

/* Une question posée dans la page, jamais par confirm() : les navigateurs finissent par
   taire ces boîtes — « ne plus afficher de dialogues » —, et le bouton semblait alors
   mort. Ici, une boîte à nous : Échap ou Annuler refusent, le bouton principal accepte. */
function demander(texte,ok){return new Promise(res=>{let d=$('demande');
 if(!d){d=document.createElement('dialog');d.id='demande';d.className='demande';
  d.innerHTML='<p id="demande-texte"></p><div class="form-actions"><button type="button" id="demande-non">Annuler</button><button type="button" id="demande-oui" class="primary"></button></div>';
  document.body.append(d)}
 $('demande-texte').textContent=texte;$('demande-oui').textContent=ok||'Confirmer';
 let repondu=false;const fin=v=>{if(repondu)return;repondu=true;if(d.open)d.close();res(v)};
 $('demande-non').onclick=()=>fin(false);$('demande-oui').onclick=()=>fin(true);d.onclose=()=>fin(false);
 d.showModal();$('demande-oui').focus()})}
$('end-combat').onclick=async()=>{if(view!=='mj')return;

/* Revenir au tour 1 : les créatures analysées redeviennent des inconnues, sans numéro, et
   chacun perd ses états — Feu, Saignée, Blindage, tout — la rencontre repart entière.
   Seul le Coma tient : il dit les points de vie, qui ne changent pas. Ouvrir une carte
   fait la même chose, sans demander. */
function remiseAuTourUn(){round=1;actors.forEach(a=>{a.checks=[0,0,0];a.target=null;a.targets=[];a.orbes=0;a.garde=null;a.ignition='';
  // Une rencontre qui repart, c'est un repos : les insensibilités tombent, les charges du jour reviennent.
  a.immunites={etats:[],des:[]};if(typeof reposer==='function')reposer(a,'long');else a.usages={};
  a.states=[];a.bleed=0;a.cumuls={};if(a.hp===0)setState(a,'Coma',true);
  if(!a.hero){a.revealed=false;a.vu=false;a.numero=null}});
 $('round').textContent='01'}
$('reset-round').onclick=async()=>{if(view!=='mj'||!await demander('Revenir au tour 1 ? Les activations, les cibles, les états et les analyses sont remis à zéro, les adversaires redeviennent inconnus ; les PV ne changent pas.','Revenir au tour 1'))return;
 remiseAuTourUn();render();log('Tour de combat réinitialisé : retour au tour 1.');scheduleSave()};
/* Huit boutons sur deux rangées : la mort ouvre en haut à gauche, le soin ferme en bas

const PV_BOUTONS=[
 {texte:'Mort',classe:'mort',titre:'Tomber à zéro et sombrer dans le coma',ecart:a=>-a.hp},

 return b}));$('next').onclick=()=>{if(view!=='mj')return;savePool();burnAll();actors.forEach(o=>regenerer(o,'fin'));round++;actors.forEach(a=>{a.checks=[0,0,0];a.orbes=0});$('round').textContent=String(round).padStart(2,'0');render();log('Début du tour '+round+'. Activations réinitialisées.');if(actors.filter(o=>regenerer(o,'debut')).length)render()};$('upload').onclick=()=>$('mapfile').click();$('mapfile').onchange=()=>{const f=$('mapfile').files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){log('Carte non chargée : utilise une image PNG, JPEG ou WebP.');return}if(mapUrl)URL.revokeObjectURL(mapUrl);mapUrl=URL.createObjectURL(f);$('map-view').style.backgroundImage='url("'+mapUrl+'")';$('map').classList.add('custom');log('Carte importée sur cet appareil. Le plan et ses murs sont masqués : plus d’obstacle défini.');};
/* Le thème vit dans le navigateur, pas dans la partie : chacun lit comme il veut. */
/* Les gestes de la carte et la touche qui les commande. « Aucune » veut dire le clic nu ;

const GESTES=[['select','Sélection','Choisir un combattant'],
 ['target','Ciblage','Désigner la cible du combattant actif'],
 ['multi','Sélection multiple','Ajouter ou retirer de la sélection'],
 ['autoattack','Attaque auto','Désigner puis frapper aussitôt'],

 doigts={...milieuDoigts(e.touches),d:ecartDoigts(e.touches),zoom:mapZoom}},{passive:false});
$('map').addEventListener('touchmove',e=>{if(!doigts||e.touches.length!==2)return;e.preventDefault();
 const r=$('map').getBoundingClientRect(),c=milieuDoigts(e.touches),d=ecartDoigts(e.touches);
 zoomMapAt(doigts.zoom*(d/doigts.d)/mapZoom,c.x-r.left,c.y-r.top);
 if(mapZoom>1){mapPanX+=c.x-doigts.x;mapPanY+=c.y-doigts.y;applyMapZoom()}
 doigts.x=c.x;doigts.y=c.y},{passive:false});

$('map').addEventListener('gesturestart',e=>e.preventDefault());

/* Un cadre tracé sur la carte prend tout ce qu'il enferme. Le glissement simple lui
   revient : le panoramique passe au bouton droit, la molette et le pincement continuant
   de le faire comme avant. Un cadre plus petit qu'une poussière n'est qu'un clic. */
let cadre=null;
function cadreEnPourcent(){const size=mapSize();if(!size.width||!cadre)return null;
 const r=$('map-view').getBoundingClientRect();
 const pct=(v,total)=>Math.max(0,Math.min(100,v/total*100));
 const x1=pct(Math.min(cadre.x0,cadre.x)-r.left,r.width),x2=pct(Math.max(cadre.x0,cadre.x)-r.left,r.width);
 const y1=pct(Math.min(cadre.y0,cadre.y)-r.top,r.height),y2=pct(Math.max(cadre.y0,cadre.y)-r.top,r.height);
 return {x1,y1,x2,y2}}
function dessineCadre(){const el=$('marquee'),z=cadreEnPourcent();
 if(!z){el.hidden=true;return}
 el.hidden=false;el.style.left=z.x1+'%';el.style.top=z.y1+'%';
 el.style.width=(z.x2-z.x1)+'%';el.style.height=(z.y2-z.y1)+'%'}
/* Reposer tout ce qui est pris. Un clic sur le décor, un cadre vide ou Échap disent la
   même chose : on lâche. Silencieux — le journal n'a pas à tenir le compte des clics. */
function leverSelection(){if(!marked.size&&selected===null)return false;
 saveChecks();savePool();marked=new Set();selected=null;render();return true}
function prendreDansCadre(){const z=cadreEnPourcent();$('marquee').hidden=true;
 if(!z)return;
 /* L'indice sert au test de voile : sans lui, la vue joueur levait une erreur et le
    cadre ne prenait plus rien — seuls les combattants déjà choisis restaient. */
 const pris=actors.map((a,i)=>[a,i])
  .filter(([a,i])=>alive(a)&&a.x>=z.x1&&a.x<=z.x2&&a.y>=z.y1&&a.y<=z.y2
   &&!(view!=='mj'&&cachePour(a,i)));
 // Un cadre tracé sur le vide lève la sélection : c'est la façon de tout reposer.
 if(!pris.length){leverSelection();return}
 marked=new Set(pris.map(([a])=>a.id));
 const actif=pris.find(([,i])=>controlled(i))||pris[0];
 saveChecks();savePool();selected=actif[1];
 log(pris.length===1?pris[0][0].name+' sélectionné.':pris.length+' combattants sélectionnés.',{local:true});
 render()}
$('map').addEventListener('pointerdown',e=>{
 /* Le cadre ne part pas d'un socle ni d'une porte : c'est un geste sur le décor. Le
    garde-fou visait la seule balise « rect », du temps où toute porte en était une — une
    porte de biais est un polygone, et son clic partait donc dans le cadre au lieu de
    l'ouvrir. On désigne maintenant le calque des portes, quelle que soit leur forme. */
 if(e.target.closest('.token')||e.target.closest('#map-doors'))return;
 // Bouton droit : panoramique. Bouton gauche : cadre de sélection.
 if(e.button===2){if(mapZoom<=1)return;
  panDrag={x:e.clientX,y:e.clientY};$('map').classList.add('panning');return}
 if(e.button!==0)return;
 cadre={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,bouge:false};
 $('map').setPointerCapture(e.pointerId)});
$('map').addEventListener('pointermove',e=>{if(!cadre)return;
 cadre.x=e.clientX;cadre.y=e.clientY;
 if(Math.abs(cadre.x-cadre.x0)>4||Math.abs(cadre.y-cadre.y0)>4)cadre.bouge=true;
 if(cadre.bouge)dessineCadre()});
$('map').addEventListener('pointerup',e=>{if(!cadre)return;
 // Un clic sur le décor repose ce qui était pris : c'est le geste qu'on fait sans y penser.
 const tracé=cadre.bouge;if(tracé)prendreDansCadre();else{$('marquee').hidden=true;leverSelection()}
 cadre=null;try{$('map').releasePointerCapture(e.pointerId)}catch(err){}});
$('map').addEventListener('contextmenu',e=>{if(!e.target.closest('.token'))e.preventDefault()});
$('map').addEventListener('pointerup',()=>{panDrag=null;$('map').classList.remove('panning')});
$('map').addEventListener('pointerleave',()=>{panDrag=null;$('map').classList.remove('panning');
 if(cadre){cadre=null;$('marquee').hidden=true}});
$('zoom-in').onclick=()=>zoomMapAt(1.25,$('map').clientWidth/2,$('map').clientHeight/2);
$('zoom-out').onclick=()=>zoomMapAt(1/1.25,$('map').clientWidth/2,$('map').clientHeight/2);
$('zoom-reset').onclick=resetMapZoom;

 localStorage.setItem('amertume-portees',porteesOn?'1':'0');majPortees();updateRing()};
majPortees();
