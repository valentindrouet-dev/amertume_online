 font-weight:700;font-style:normal;font-display:swap}

/* Deux palettes, un seul jeu de règles : tout le décor passe par ces jetons, si bien
   que basculer d'un thème à l'autre ne touche pas une seule déclaration de mise en page.
   Les couleurs de jeu — dés, murs, socles, brouillard — n'en font pas partie : elles

:root{color-scheme:light;--bg:#e9e3d5;--panel:#f8f4e9;--panel-2:#eee7d6;--field:#fffdf5;

--t-select:#a9c8e6;--t-wall:#c3d0d4;--t-door:#e9c08a;--t-start:#a9d7bc;--t-foe:#e8b0a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--btn);border-radius:6px;padding:8px 12px}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}button:disabled{opacity:.45;cursor:default}button.inerte{opacity:.45;cursor:default}button.inerte:hover{filter:none}header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}/* Le titre tient sur deux lignes : le nom du jeu, et dessous ONLINE en petites capitales brunes. */.brand{display:flex;flex-direction:column;align-items:flex-start;gap:0;font-family:'Killam',Georgia,serif;font-size:30px;letter-spacing:3px;line-height:1.05}.brand-ligne{display:flex;align-items:baseline;gap:14px}.brand-online{font:600 13px system-ui;letter-spacing:7px;color:var(--accent)}.brand .ver{font:14px system-ui;letter-spacing:1px;color:var(--muted)}.intro{padding:18px 28px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:0}h2{font-size:15px;margin:0 0 14px;letter-spacing:1px}p{margin:6px 0}.muted{color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;gap:18px;padding:20px 28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.stack{display:flex;flex-direction:column;gap:16px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}/* Languettes : de quoi lire un nom et des PV, pas plus. */.actor{width:100%;display:flex;align-items:center;gap:9px;text-align:left;margin:5px 0;padding:6px 8px;background:transparent}.actor strong{font-size:13px}.actor .avatar{width:26px;height:26px;font-size:15px}/* Deux pastilles au-dessus de la vignette : l'Action et le Mouvement qui restent. La

.vie-ligne{display:flex;align-items:center;gap:6px;margin-top:3px}

.vie-ligne .ecu{flex:none;width:17px;height:20px}
.vie-ligne .ecu b{font-size:9px}.actor .lifebar-text{padding:0 9px;font:700 11px/1 system-ui}.actor.selected{background:var(--sel);border-color:var(--green)}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--green);color:var(--green);font-family:'Killam',Georgia;font-size:20px}.enemy .avatar{border-color:var(--type,#cf8074);color:var(--type,#cf8074)}
/* Chaque type d'adversaire porte sa couleur dans la liste des combattants : on lit d'un
   coup ce qu'on affronte, même quand le portrait remplace l'initiale. Le liseré de gauche
   le dit aussi bien que l'anneau, et les deux tiennent sur fond clair comme sur fond
   sombre. Sbire gris, Élite doré, Solitaire rouge, Boss violet. */
.actor.k-standard{--type:#8d9794}
.actor.k-alpha{--type:#c9953f}
.actor.k-solitaire{--type:#c8523f}
.actor.k-boss{--type:#9b6fb5}
.actor.enemy{border-left:3px solid var(--type,#cf8074)}/* La vignette entière prend la teinte pâle du type, celle du bestiaire ; la sélection garde la sienne. */.actor.enemy.k-standard:not(.selected){background:#dcd8cf}.actor.enemy.k-alpha:not(.selected){background:#efdcc2}.actor.enemy.k-solitaire:not(.selected){background:#e8d3cb}.actor.enemy.k-boss:not(.selected){background:#e2d0e8}body.sombre .actor.enemy:not(.selected){background:color-mix(in srgb,var(--type) 22%,var(--panel))}.actor-body{flex:1;min-width:0}.actor strong{display:block;font:700 14px 'Killam',Georgia,serif;letter-spacing:.3px}.actor small{font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:20px 0}/* Le numéro de tour se lit à côté de son intitulé, sur une seule ligne. *//* L'intitulé et le numéro se lisent d'un même souffle : même corps, même graisse, le
   numéro au bout de la ligne. Les boutons en dessous respirent et pèsent leur poids. */.turn-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px;flex-wrap:nowrap;white-space:nowrap}/* Chez un joueur, rien ne suit le titre du tour : ni marge, ni rangées vides. */body.vue-joueur .turn-head{margin-bottom:0}.side-actions:not(:has(button:not([hidden]))){display:none}body.vue-joueur .turn-actions:not(:has(button:not([hidden]))){display:none}.turn-head .eyebrow{font:700 15px/1 'Killam',Georgia,serif;letter-spacing:1.4px;text-transform:uppercase}#round[hidden]{display:none}.side-actions #start-combat{width:100%;height:40px;font:700 15px/1 system-ui}.side-actions #end-combat{width:100%;height:34px;font:600 13px/1 system-ui;color:var(--muted)}.turn{font:700 15px/1 'Killam',Georgia,serif;letter-spacing:1px;margin:0;color:var(--ink)}.checks{display:flex;gap:7px;flex-wrap:wrap}.checks label{font-size:14px;background:var(--panel-2);border-radius:5px;padding:7px;cursor:pointer}.checks input{accent-color:var(--accent)}/* Dégeler et Se relever sont des activations comme l'attaque : ils tiennent la même barre. *//* Les attaques offertes : voir .choix-attaque dans editor.css, chargé après. */.choix-attaques{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}.choix-attaques[hidden]{display:none}/* L'intitulé de la carte porte le bleu des Actions, et le bonus de dégâts se lit à sa droite. */.actions-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.titre-actions{font:700 20px/1 'Killam',Georgia,serif;letter-spacing:3px;text-transform:uppercase;color:#3f7bc0}body.sombre .titre-actions{color:#8fb6e0}.attack-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.etat-actions{display:flex;gap:8px;flex-wrap:wrap}.etat-actions button{font-size:14px;padding:8px 14px}.etat-actions .btn-action{padding:8px 18px}.map-panel{padding:0;overflow:hidden}/* La barre de la carte tient sur deux rangées : en haut ce qui regarde la carte — son
   nom, les portées, le zoom, le brouillard —, en bas ce qui la change. Tout tenait sur
   une seule ligne : les mots se brisaient en trois et la liste des cartes se réduisait
   à deux lettres. */.mapbar{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:12px 18px}.mapbar-h1,.mapbar-h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.mapbar button{white-space:nowrap}.mapbar strong{font:400 19px/1.2 'Killam',Georgia,serif;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}.mapbar-h2 #reset-map{margin-left:auto}#map-pick{min-width:12ch;max-width:24ch}.zoom-bar{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}.zoom-bar button{padding:5px 10px}.turn-actions{display:flex;gap:10px;align-items:stretch}.turn-actions .full{flex:1}.turn-actions button{height:40px;font:700 15px/1 system-ui;padding:0 14px}.turn-actions #reset-round{flex:none;width:44px;padding:0;font-size:17px}.side-actions{margin-top:10px}.side-actions button{width:100%;height:40px;font:700 15px/1 system-ui}
/* Tout le monde a dépensé son Action : le tour appelle la suite. */
@keyframes appel-tour{0%,100%{box-shadow:0 0 0 0 rgba(160,120,60,0)}50%{box-shadow:0 0 0 5px rgba(160,120,60,.34)}}
#next.appelle{border-color:var(--accent);color:var(--accent);animation:appel-tour 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){#next.appelle{animation:none;box-shadow:0 0 0 3px rgba(160,120,60,.34)}}/* Icônes de brouillard : la barre de carte reste courte. */.icon-btn{padding:5px 9px;font-size:15px;line-height:1}.icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}#fog-bar{margin-left:2px}#zoom-label,#czoom-label{min-width:52px;text-align:center}.map{position:relative;margin-inline:auto;height:460px;background-color:var(--map-bg);overflow:hidden;isolation:isolate}/* Pas de will-change : Safari gardait l'image de la couche à l'échelle 1 et l'étirait, floue, jusqu'au rendu suivant. */#map-view{--token:46px;position:absolute;inset:0;transform-origin:0 0;background-image:linear-gradient(#84958a16 1px,transparent 1px),linear-gradient(90deg,#84958a16 1px,transparent 1px);background-size:5% 8.333%}.map .plan{width:100%;height:100%;position:absolute;inset:0;z-index:-1}.map.custom #map-view{background-size:100% 100%;background-position:0 0;background-repeat:no-repeat}.map.panning{cursor:grabbing}.map.custom .plan,.map.has-map .plan{display:none}/* Tout ce qui entoure un socle — liseré, ombre, halo, cerceau de cible, jauge de vie —
   se mesure sur lui. Une carte à grande échelle donne de petits socles : leurs parures
   rétrécissent avec eux au lieu de les noyer. */
.token{position:absolute;z-index:1;transform:translate(-50%,-50%);width:var(--token);height:var(--token);border:max(1px,calc(var(--token)*.036)) solid #9fc8b1;background:#284a40;border-radius:50%;font:bold calc(var(--token)*.47) 'Killam',Georgia;box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008;padding:0;touch-action:none;user-select:none}.token.enemy{background:#633e38;border-color:#d29180}/* L’actif se voit sur la carte quelle que soit son attaque. Le disque de contact, lui,
   ne paraît que pour une attaque au contact : il dit une portée, pas une sélection. */.token.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #9fc8b1d9}/* Le combattant qu'un joueur regarde : un halo ambre, distinct de sa sélection verte. */.placement #map{cursor:crosshair}.placement #map-view .token{pointer-events:none}.token.inspecte{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #e0c37ad9}.actor.inspecte{border-color:#c9a24a}#sheet.secret :is(#sheet-chips,#stats,#hpbar,#bloc-gear,#bloc-talents,#skills,.divider){display:none}.token.enemy.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #d29180d9}/* Un groupe se voit à son halo, comme l'actif : sur la carte, tous les pris sont pareils. */.actor.marked{border-color:var(--accent);background:var(--hover)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.dicebar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.die-input{flex:1;min-width:54px;text-align:center}.die-input label{display:block;font-size:12px;color:var(--muted);margin-top:5px}.die-input input{width:46px;height:44px;text-align:center;border:none;border-radius:11px;font:800 18px system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 3px 6px #0000005e}.dice-results{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;min-height:56px;padding:9px 11px;background:#0e1518;border:1px solid #ffffff12;border-radius:13px;box-shadow:inset 0 2px 5px #00000066}.result{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;font:800 18px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 3px 6px #0000005e}.result.dark{color:#f4f6f2}.bonus-chip{padding:7px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--accent);font:700 14px system-ui;white-space:nowrap}.summary{font-size:14px;color:var(--muted);margin-top:12px}.sheet{border-top:3px solid var(--accent)}.sheet h2.sheet-sous{margin:14px 0 8px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sheet-head h1{font-size:26px}#name{font-family:'Killam',Georgia,serif;letter-spacing:.5px}.sheet-class{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font:700 11px system-ui;letter-spacing:2px;white-space:nowrap}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}.chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(50px,1fr));gap:5px;margin:14px 0}#class{display:none}.stat-tile{background:rgba(var(--tint),.14);border:1px solid rgba(var(--tint),.34);border-radius:10px;padding:8px 3px;text-align:center;min-width:0;overflow:hidden}.stat-tile span{display:block;font:600 9px system-ui;letter-spacing:.8px;text-transform:uppercase;color:rgb(var(--tint));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-tile strong{display:block;font:700 22px/1.1 'Killam',system-ui;margin-top:5px;color:var(--ink);white-space:nowrap}.stat-tile small{display:block;margin-top:6px;font:600 9px/1 system-ui;letter-spacing:.6px;color:var(--muted);white-space:nowrap}.ecu{position:relative;display:block}.ecu img{width:100%;height:100%;display:block}
/* Au-delà du 6, le chiffre est posé sur l'écu vide, dans le creux du blason. */
.ecu b{position:absolute;inset:16% 0 24%;display:grid;place-items:center;font-family:'Killam',Georgia,serif;color:#101010}
.stat-tile .ecu b{font-size:17px}
/* Le jeton d'état, posé en bas à droite du socle, comme sur la table. */
/* Le numéro d'un homonyme : à droite du nom dans la liste, au coin haut gauche du socle. */
.actor-nom{display:flex;align-items:baseline;gap:6px;min-width:0}
/* Le nom garde le droit de passer à la ligne, et son accent celui de dépasser :
   « overflow:hidden » rognait le É d'Éla par le haut. Le numéro reste sur la première ligne. */
.actor-nom strong{flex:0 1 auto;min-width:0}
.actor .num{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--hover);border:1.5px solid var(--line);font:700 10px/1 system-ui;color:var(--ink);box-shadow:0 1px 2px #0000002e}
/* Le même jeton que dans la liste — même fond, même liseré, même chiffre — posé
   à l'intérieur du socle : au-dessus, il mordait sur la barre de PV. */
/* Un vrai rond : la boîte est carrée et le chiffre centré dedans. Une largeur minimale
   avec du remplissage donnait un ovale, puisque hauteur et largeur ne se suivaient pas. */
.token .numero{position:absolute;left:-6%;top:3%;display:grid;place-items:center;width:calc(var(--token)*.32);height:calc(var(--token)*.32);border-radius:50%;background:var(--hover);border:max(1px,calc(var(--token)*.024)) solid var(--line);color:var(--ink);font:700 calc(var(--token)*.19)/1 system-ui;z-index:3;pointer-events:none;box-shadow:0 1px 3px #00000059}
.token .etats{position:absolute;right:-6%;bottom:-6%;display:flex;flex-direction:row-reverse;gap:1px;z-index:2;pointer-events:none}
.token .etat{width:calc(var(--token)*.26);height:calc(var(--token)*.26)}/* L'ombre appartient au jeton, pas à son compte : portée par l'état entier, elle cernait le chiffre d'un liseré noir. */.token .etat img{filter:drop-shadow(0 1px 2px #000d)}
/* La barre de PV se pose sous le socle, jamais dessus : le jeton d'état la recouvre au
   besoin. Les joueurs ne lisent que la leur — pour les autres la barre reste pleine,
   comme dans la liste des combattants. */
/* La jauge est la même pour tous les socles, quel que soit celui qu'on joue : un fil, pas un bandeau. */#pv-layer{position:absolute;inset:0;z-index:3;pointer-events:none}#pv-layer .pv.unseen{visibility:hidden}#pv-layer .pv.glisse{transition:left .18s linear,top .18s linear}#pv-layer .pv{position:absolute;transform:translate(-50%,-100%);margin-top:calc(var(--token) / -2 - 4px);width:calc(var(--token) * .96);height:3.2px;border-radius:999px;background:#211f1b;border:1px solid #0000008c;box-shadow:inset 0 1px 2px #00000080;overflow:hidden;pointer-events:none}
#pv-layer .pv i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3d7f4b,#8ac96e)}
#pv-layer .pv.enemy i{background:linear-gradient(90deg,#c1512e,#e8ac4e)}
.token .etat{position:relative}.token .etat img{width:100%;height:100%;display:block}.token .etat b{position:absolute;right:-10%;bottom:-16%;color:#fff;font:700 calc(var(--token)*.15)/1 system-ui;text-align:center}
.stat-tile .ecu{width:30px;height:36px;margin:5px auto 1px}
/* Le « + » des dégâts respire : sans cet écart il colle au chiffre. Le retrait de gauche
   compense l'interlettrage qui, lui, pousse aussi après le dernier caractère. */
.stat-tile.t-dmg strong{letter-spacing:4px;padding-left:4px;color:var(--red-mat)}.hp{display:flex;align-items:center;justify-content:space-between;gap:8px}/* Des paliers, pas un point à la fois : soigner un monstre de 33 PV se faisait à la main. */
.hp-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hp-buttons button{padding:5px 2px;font:600 13px system-ui}
/* Les retraits en rouge, les ajouts en vert, et les deux extrêmes pleins pour qu'on les
   trouve du premier coup d'œil : Mort en haut à gauche, Soin en bas à droite. */
.hp-buttons button.moins{color:var(--red-mat);border-color:var(--red-mat)}
.hp-buttons button.moins:hover{background:#a4442f1f}
.hp-buttons button.plus{color:var(--green);border-color:var(--green)}
.hp-buttons button.plus:hover{background:var(--sel)}
.hp-buttons button.mort{background:var(--red-mat);border-color:var(--red-mat);color:#fdf3f0}
.hp-buttons button.mort:hover{filter:brightness(1.12)}
.hp-buttons button.soin{background:var(--green);border-color:var(--green);color:#f2f9f4}
.hp-buttons button.soin:hover{filter:brightness(1.12)}
.pv-panel .eyebrow{margin-bottom:2px}

.pv-panel[hidden]{display:none}
.hp-buttons[hidden]{display:none}/* Le chiffre se centre par la boîte, pas par une hauteur de ligne : la bordure mangeait
   deux pixels de la boîte de contenu et poussait le texte vers le bas. */
.lifebar{position:relative;display:flex;align-items:center;height:22px;border-radius:999px;background:#211f1b;border:1px solid #0000008c;box-shadow:inset 0 2px 4px #00000080;overflow:hidden;margin-top:5px}.lifebar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#3d7f4b,#8ac96e);box-shadow:inset 0 1px 0 #ffffff40;transition:width .25s}.lifebar.foe .lifebar-fill{background:linear-gradient(90deg,#c1512e,#e8ac4e)}.lifebar-text{position:relative;flex:1;min-width:0;padding:0 11px;font:600 12px/1 system-ui;color:#f4f7f0;text-shadow:0 1px 2px #000000b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lifebar.big{height:30px;margin:10px 0 16px}.lifebar.big .lifebar-text{font:700 15px/1 system-ui}.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}.skill-chip{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;font:600 13px system-ui;padding:9px 10px;border-radius:9px;background:rgba(var(--tint),.13);border:1px solid rgba(var(--tint),.38);color:var(--ink)}.skill-chip:hover{background:rgba(var(--tint),.22)}.skill-chip.zero{opacity:.42}.skill-chip b{background:rgba(var(--tint),.26);color:rgb(var(--tint));border-radius:6px;padding:1px 7px;font:800 12px system-ui}select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:8px;margin-top:8px}.journal{max-height:224px;overflow:auto;list-style:none;padding:0;margin:0}.journal li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.journal time{display:block;color:var(--accent);font-size:11px}.full{width:100%}footer{padding:0 28px 20px;color:var(--muted);font-size:12px}.file{font-size:13px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:1500px){.layout{grid-template-columns:260px minmax(0,1fr) 380px}.map{height:560px}}@media(max-width:1150px){.layout{grid-template-columns:205px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.map{height:420px}}@media(max-width:700px){header{padding:15px}.brand{font-size:22px}.brand-online{font-size:11px;letter-spacing:5px}.intro{padding:15px;align-items:flex-start;flex-direction:column}.layout{padding:0 12px 16px;grid-template-columns:1fr}.left{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{padding:14px}.map-panel{padding:0}.left .panel{min-width:0}.actor{padding:5px 4px}.right{grid-column:auto;grid-template-columns:1fr}.map{height:350px}.intro h1{font-size:26px}.toolbar button{flex:1}footer{padding:0 15px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.view-controls select{width:auto;margin:0}.targeted{outline:3px solid #f07872!important;outline-offset:4px}.token.targeted{outline-width:max(1px,calc(var(--token)*.03))!important;outline-offset:calc(var(--token)*.05)!important}.actor.targeted{outline-offset:0}.target-box{margin:12px 0;padding:12px;border:1px solid #885650;border-radius:6px}.target-box select{margin:6px 0}.attack-info{color:var(--accent);font-size:14px}.rules{font-size:14px;color:var(--muted);margin-top:16px}.rules summary{cursor:pointer}.dead{opacity:.5}header{flex-wrap:wrap}.token{touch-action:none}#contact-ring{position:absolute;inset:0;z-index:0;pointer-events:none}#contact-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.portee{fill:#8bbd9c62;stroke:#9fc8b1e0;stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}.portee.foe{fill:#cf807462;stroke:#d29180e0}.toggle-portees{font:600 13px system-ui;padding:5px 11px;letter-spacing:.2px}#aim{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}/* Flèche de ciblage : bleue quand le coup peut partir, rouge quand la distance ou la vue   l'interdisent, grise quand l'Action est déjà passée. */#aim .aim-fleche{display:none;fill:none;stroke-linecap:round}#aim .aim-fleche.on{display:block}#aim .aim-fleche.etat-ok{stroke:#3f7bc0;filter:drop-shadow(0 0 6px #3f7bc073)}#aim .aim-fleche.etat-no{stroke:#e0483c;stroke-dasharray:10 9;opacity:.8}#aim .aim-fleche.etat-done{stroke:#8b969b;stroke-dasharray:6 7;opacity:.6}.map.aiming,.map.aiming .token{cursor:crosshair}
/* Poser un état : clic droit sur le socle. Le menu est en position fixe et hors de la
   carte, sinon le débordement de celle-ci le rognerait. */
#state-menu{position:fixed;z-index:60;display:grid;grid-template-columns:repeat(4,64px);gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px #0006}
#state-menu[hidden]{display:none}
#state-menu button{display:grid;justify-items:center;gap:3px;padding:6px 2px 5px;border:1px solid transparent;border-radius:8px;background:transparent;font:600 10px system-ui;color:var(--muted);line-height:1.1}
#state-menu button:hover{background:var(--hover);color:var(--ink)}
#state-menu button.on{border-color:var(--green);background:var(--sel);color:var(--ink)}
#state-menu img,#state-menu .vide{width:30px;height:30px}
#state-menu .vide{display:grid;place-items:center;font-size:17px;color:var(--muted)}/* Le voile tient sa propre ligne, sous les etats : ce n'est pas une affection. */#state-menu .menu-sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0 2px}#state-menu button.voile{grid-column:1/-1;grid-auto-flow:column;justify-items:start;align-items:center;justify-content:start;gap:9px;padding:7px 8px;font-size:12px}#state-menu button.voile .vide{width:22px;height:22px;font-size:15px}#state-menu button.voile.on{border-color:#e2ae72;background:#e2ae7226;color:var(--ink)}/* Deux voiles, deux raisons, deux dessins : le MJ voit d'un coup d'oeil s'il cache lui-meme un adversaire, ou si la troupe ne le voit simplement pas. Un troisieme trait, bleu, pour l'etat Invisible : celui-la, seul son joueur le voit encore. */.token.invisible-mj,.actor.invisible-mj{opacity:.55;outline:2px dashed #6fa8d0;outline-offset:2px}.token.veiled,.actor.veiled{opacity:.46;outline:2px dashed #e2ae72;outline-offset:2px}.token.cachemj,.actor.cachemj{opacity:.4;outline:2px solid #b06fd0;outline-offset:2px}.token.invisible-mj,.token.veiled,.token.cachemj{outline-width:max(1px,calc(var(--token)*.028));outline-offset:calc(var(--token)*.03)}/* Ajouter un combattant se fait au-dessus de la liste : deux boutons courts, nommés, pour ne pas confondre la troupe et ce qu'elle affronte. */.titre-outils{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ajout-combattant{flex:1;display:flex;gap:5px;justify-content:flex-end}.ajout-combattant button{white-space:nowrap;padding:3px 7px;font:600 11px system-ui;letter-spacing:0;border-radius:14px}.ajout-combattant #new-hero{color:var(--green);border-color:var(--green)}.ajout-combattant #new-monster{color:#c26a5a;border-color:#c26a5a}/* Un intitulé discret entre les deux camps : la troupe d'abord, ce qu'elle affronte ensuite. */.groupe-combattants{display:flex;align-items:center;gap:8px;margin:10px 0 3px;padding-top:9px;border-top:1px solid var(--line);font:600 10px system-ui;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}/* Le groupe replié : un chevron, et la liste qui se déplie dessous. */.groupe-replie{margin:0}.groupe-replie>summary{cursor:pointer;list-style:none;user-select:none}.groupe-replie>summary::-webkit-details-marker{display:none}.groupe-replie>summary::before{content:'▸';display:inline-block;width:11px;transition:transform .15s}.groupe-replie[open]>summary::before{transform:rotate(90deg)}/* Le jeton Onde devant « Adversaires à 100 % ». */.btn-ico{width:18px;height:18px;vertical-align:-4px;margin-right:3px}button.ajout-camp{margin-left:auto;width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:50%;font:700 14px/1 system-ui;letter-spacing:0;color:var(--muted)}button.ajout-camp:hover{color:var(--accent);border-color:var(--accent)}/* L'Onde du camp : le même rond que le « + », l'image dedans ; le « + » garde le bord droit. */.ajout-camp.soin-camp{margin-left:auto}.ajout-camp.soin-camp+.ajout-camp{margin-left:0}.soin-camp img{width:14px;height:14px;display:block;pointer-events:none}.groupe-combattants:first-child button.ajout-camp{color:var(--green)}button.ajout-camp[hidden]{display:none}#actors>.groupe-combattants:first-child{margin-top:0;padding-top:0;border-top:0}.voile-note{display:block;margin-top:2px;font:600 10px system-ui;letter-spacing:.2px;color:#c08a4e}.actor.cachemj .voile-note{color:#b06fd0}.token.unseen,.actor.unseen{visibility:hidden;pointer-events:none}/* Jamais révélé : un nom, un socle, rien d'autre. Révélé mais hors de vue : la ligne entière, pâlie. *//* Sans pastilles ni barre, le socle n'a plus à descendre pour leur faire place : il se remet à hauteur du nom. */.actor.inconnu{opacity:.72}.actor.inconnu .avatar{filter:grayscale(.6)}.actor.inconnu .vignette,.actor.inconnu .vignette .avatar{transform:none}.actor.inconnu .actor-nom{align-items:center}.actor.horsvue{opacity:.5}#map-shapes{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#fog{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}/* Le voile d'attente : opaque, au-dessus de tout, jusqu'à ce que le brouillard soit peint. */#voile-attente{position:absolute;inset:0;z-index:40;background:#06090b;pointer-events:none}#voile-attente[hidden]{display:none}/* Les portes se peignent au-dessus du brouillard : découvertes, elles restent lisibles. */#map-doors{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}#map-shapes .wall-group{opacity:.62}#map-shapes .wall-group path.fond{fill:#0b1114;stroke:none}/* À la table, la matière n'a pas de liseré : le premier passage ne peint rien. */#map-shapes .wall-group path.bord{fill:none;stroke:none}/* Une porte n'est jamais un bloc plein : close, un contour orange ; ouverte, le même en pointillé gris. */#map-doors .door{fill:none;stroke:#c98a4b;stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:.95;cursor:default;transition:stroke .12s,stroke-width .12s,filter .12s}#map-doors .door.open{stroke:#96a3a7;stroke-width:2;stroke-dasharray:7 6;opacity:.8}#map-doors .door.keyed{stroke:#f3d7a6;stroke-width:3.5}/* Un passage secret ne se dessine que pour le MJ tant qu'il est clos : un trait violet   en pointillé serré, pour ne pas le confondre avec une porte que la troupe voit. */#map-doors .door.secret{stroke:#b06fd0;stroke-width:3;stroke-dasharray:4 3}#map-doors .door.secret.open{stroke:#96a3a7;stroke-width:2;stroke-dasharray:7 6}#map-doors .door.secret.can-open:hover{stroke:#c98ae0;stroke-width:4;filter:drop-shadow(0 0 6px #b06fd099)}#map-doors .door.keyed.open{stroke:#b9c3c6;stroke-width:2.5}/* Survol d'une porte que l'on peut manœuvrer : elle s'allume. */#map-doors .door.can-open{cursor:pointer}#map-doors .door.can-open:hover{stroke:#f6d9a8;stroke-width:4;opacity:1;filter:drop-shadow(0 0 6px #e2ae7299)}#map-doors .door.can-open.open:hover{stroke:#dfe8ea;stroke-width:3.5}#map-shapes .startzone{fill:#8bbd9c;opacity:.12;stroke:#8bbd9c;stroke-width:2;stroke-dasharray:8 6}/* Le plateau à dés est hors du calque zoomé : les dés se posent au bas de la table
   visible, quel que soit le zoom ou le recadrage de la carte. */
/* La piste de dés : un panneau à droite des Actions, un tiers de la largeur, où les dés animés tombent — plus jamais sur la carte. */.actions-rangee{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:stretch}/* Le plateau des Dés a la hauteur du bloc Actions, quel que soit le nombre de dés : la rangée ne grandit jamais. */.piste-des{display:flex;flex-direction:column;gap:8px;height:220px;overflow:hidden}#dice-tray{position:relative;flex:1;min-height:110px;border-radius:12px;background:#0e1518;border:1px solid #ffffff12;box-shadow:inset 0 2px 6px #00000066;pointer-events:none;overflow:hidden}@media(max-width:700px){.actions-rangee{grid-template-columns:1fr}.piste-des{min-height:110px}}/* Un dé qui ne compte pas — double d'os, face de Faille — s'efface : gris, à demi transparent, sans ombre, un peu plus petit. */.board-die.barre{opacity:.35!important;filter:grayscale(1);box-shadow:none;transform:scale(.88)!important}/* Le « + » du critique et le bonus de dégâts, en Killam. *//* Les visages sur la piste : ronds, liserés à la couleur du camp. */.board-token{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#2a2622;color:#e7d9b8;font:800 16px 'Killam',Georgia,serif;border:2px solid #9fc8b1;box-shadow:0 2px 6px #000a;box-sizing:border-box}.board-token.adverse{border-color:#d29180}.board-token img{width:100%;height:100%;object-fit:cover;display:block}.board-plus{position:absolute;transform:translate(-50%,-50%);font:800 18px 'Killam',Georgia,serif;color:#e7d9b8;text-shadow:0 1px 2px #000c}.board-bonus{position:absolute;transform:translate(-50%,-50%);font:800 24px 'Killam',Georgia,serif;color:#e0604a;text-shadow:0 1px 2px #000c;white-space:nowrap}/* La DEF de la cible, en bout de ligne : un « − » et son écu — ce qu'elle retranche aux dégâts. */.board-def{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;font:800 24px 'Killam',Georgia,serif;color:#8fb8dc;text-shadow:0 1px 2px #000c;white-space:nowrap}.board-def img{width:26px;height:31px;object-fit:contain;filter:drop-shadow(0 1px 2px #000c)}
/* Les chiffres qui montent au-dessus d'un socle : ils vivent dans leur propre couche,
   sinon le redessin des tokens les emporterait au premier changement de PV. */
#floaters{position:absolute;inset:0;z-index:4;pointer-events:none}/* Le cadre de sélection : tracé au-dessus de la carte, transparent aux clics. */#marquee{position:absolute;z-index:4;pointer-events:none;border:1.5px dashed var(--accent);background:rgba(160,120,60,.13);border-radius:3px}#marquee[hidden]{display:none}
.floater{position:absolute;transform:translate(-50%,-50%);font:800 22px 'Killam',Georgia,serif;white-space:nowrap;text-shadow:0 2px 4px #000000b3,0 0 2px #0009}
.floater.perte{color:#f0705a}.floater.gain{color:#8fd77e}.floater.nul{color:#e7d9b8}.board-die{position:absolute;display:grid;place-items:center;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:11px;font:800 20px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 7px 16px #000000a6;will-change:transform}.board-die.dark{color:#f4f6f2}.journal-title{font:600 13px system-ui;letter-spacing:3px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}.journal{max-height:330px;display:flex;flex-direction:column;gap:9px;padding-right:4px}.journal li{border:0;padding:0}/* Les colonnes se calent sur la colonne centrale : la droite prend sa hauteur exacte et le journal y prend ce que la fiche lui laisse ; à gauche, les points de vie descendent au bas. */.stack.right.calee{min-height:0}.stack.right.calee>.panel{flex:none}.stack.right.calee>.panel:last-child{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;box-sizing:border-box}.stack.right.calee .journal{flex:1;min-height:0;max-height:none}.stack.right.calee .journal-title,.stack.right.calee .journal-chat{flex:none}/* Un seul lettrage pour les titres de blocs : petites capitales espacées, sans Killam. */.eyebrow,.turn-head .eyebrow,#titre-tour,.journal-title,.titre-actions,.panel>h2,#carte-titre{font:600 13px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:2.5px;text-transform:uppercase}/* Actions et Dés partent de la même ligne : la carte des actions perd sa marge de rangée. *//* Le bloc Actions a une hauteur fixe, vide ou garni : la carte, calée dessus, ne bouge jamais ; un contenu plus haut défile à l'intérieur. */.actions-rangee>.attack-card{margin:0;height:220px;overflow:auto}.attack-card.vide #reveal,.attack-card.vide #attack-choices{display:none}#pv-panel.vide .hp-buttons button{opacity:.45;pointer-events:none}#sheet.vide #hpbar,#sheet.vide #bloc-gear,#sheet.vide .divider{display:none}#sheet.vide .sheet-head{min-height:34px}/* La fiche prend la hauteur de ce qu'elle montre — talents et équipement dépliés compris — et le journal, calé dessous, prend tout le reste. */#sheet{min-height:0}.j-entry{font-size:14px;line-height:1.45;color:var(--ink);white-space:pre-line}/* La flèche en vol : un trait sombre à pointe claire, tourné vers sa cible. *//* Le souffle d'un tir : une rafale claire et étirée, deux filets d'air par-dessus. *//* Les coups, lisibles et toujours les mêmes : au contact, un trait de balayage fend l'air sur la cible, puis un choc — un anneau qui s'élargit ; à distance, un projectile file en ligne droite du tireur à la cible, puis le même choc. Blanc cerné de sombre : visible sur toute carte. Chaque geste dure le même temps, au même rythme. */.vfx{position:absolute;pointer-events:none;z-index:5;will-change:transform,opacity;transform:translate(-50%,-50%)}.vfx svg{display:block;width:100%;height:100%;overflow:visible}.vfx-taillade{transform:translate(-50%,-50%) rotate(var(--rot,0deg))}.vfx-taillade .revele{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:round}.vfx-taillade .lame{fill:#fffaf0}.vfx-taillade .lame-halo{fill:#f3c86a;stroke:#f3c86a;stroke-width:5;stroke-linejoin:round;opacity:.85}.vfx-taillade svg{filter:drop-shadow(0 0 1.5px #000c) drop-shadow(0 0 6px #ffcf6acc)}.vfx-etincelles .gerbe{stroke:#fff6dc;stroke-width:4.5;stroke-linecap:round}.vfx-etincelles svg{filter:drop-shadow(0 0 1px #000d) drop-shadow(0 0 4px #ffc85acc)}.vfx-fleche{transform:none}.vfx-fleche .hampe-ombre{stroke:#000a;stroke-width:5;fill:none}.vfx-fleche .hampe{stroke:#f1e4c8;stroke-width:2.6;fill:none}.vfx-fleche .plume{fill:#b8452e;stroke:#0009;stroke-width:1}.vfx-fleche .pointe{fill:#e9eef2;stroke:#000b;stroke-width:1.2}.vfx-fleche svg{filter:drop-shadow(0 0 3px #fff8)}/* Le balayage d'un coup au contact : un arc d'air, clair au bord, qui tourne autour de l'attaquant. *//* La parole : le socle de qui parle, puis ses mots. */.j-chat{display:flex;align-items:flex-start;gap:8px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:7px;padding:4px 8px;margin:2px 0}.j-avatar{flex:none;width:24px;height:24px;border-radius:50%;overflow:hidden;background:#d9cfbd;color:#2a2118;display:grid;place-items:center;font:700 12px 'Killam',Georgia,serif}.j-avatar img{width:100%;height:100%;object-fit:cover;display:block}.j-avatar.mj{background:var(--accent);color:#fff}.j-corps{min-width:0}.j-texte{white-space:pre-wrap;overflow-wrap:anywhere}.journal-vider{margin-left:auto;font:600 11px system-ui;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.journal-vider:hover{color:var(--ink);border-color:var(--ink)}.journal-chat{display:flex;gap:6px;margin-top:8px;flex:none}.journal-chat input{flex:1;min-width:0;font:14px system-ui;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}.journal-chat button{flex:none;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--accent);cursor:pointer;font-size:14px}/* Un cartouche léger, de la couleur de l'action : bleu pour un coup, violet pour un talent, une analyse ou un orbe, vert pour un soin, rouge pour une perte, ambre pour un état, or pour une révélation, brun pour la carte. */.j-entry.ton{--ton:#3f7bc0;border:1px solid color-mix(in srgb,var(--ton) 30%,transparent);background:color-mix(in srgb,var(--ton) 7%,transparent);border-radius:7px;padding:3px 8px;margin:2px 0}.j-entry.ton-attaque{--ton:#3f7bc0}.j-entry.ton-talent{--ton:#8a63c9}.j-entry.ton-soin{--ton:#2f8a63}.j-entry.ton-degats{--ton:#b8483a}.j-entry.ton-etat{--ton:#a2691f}.j-entry.ton-reveal{--ton:#9d7b1e}.j-entry.ton-carte{--ton:#8a6d3b}.j-turn{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:5px 0 1px}.j-turn::before,.j-turn::after{content:"";flex:1;height:1px;background:var(--line)}.j-name{font-weight:700}.j-key{font-weight:700}.j-num{font-weight:800;color:#b4553a}.j-dice{opacity:.7}/* La ligne d'attaque : le logo de l'arme entre les deux noms, les dégâts cliquables, le détail des dés dessous. */.j-attaque .logo-equip{width:20px;height:20px;vertical-align:-5px;margin:0 1px;filter:drop-shadow(0 1px 1px #0006)}.j-degats{font-weight:800;color:#b4553a}.j-degats.cliquable{cursor:pointer;border-bottom:1px dashed currentColor}.j-degats.cliquable:hover,.j-degats.ouvert{color:#d0644a}.j-detail{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}.j-de{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;font:800 12px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -2px 3px #00000026,0 2px 4px #0000005e}.j-de.dark{color:#f4f6f2}.j-de.barre{opacity:.35;filter:grayscale(1);box-shadow:none}.j-de.relance{margin-left:8px}.j-plus{font:600 12px system-ui;color:var(--muted)}.j-plus.total{font-weight:800;color:var(--ink)}.j-plus.def{color:#4f7fae}.j-badge{display:inline-block;background:#8d3b32;color:#ffe6df;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px}
/* Le socle qui arrive du réseau glisse jusqu'à sa place. */.token.glisse{transition:left .18s linear,top .18s linear}/* L'orbe en vol : une bille lumineuse de la couleur de ses dés. */.orbe-vol{position:absolute;will-change:transform,opacity;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;background:radial-gradient(circle at 35% 35%,#fff9,var(--orbe) 55%,transparent 72%);box-shadow:0 0 14px 5px var(--orbe),0 0 44px 16px color-mix(in srgb,var(--orbe) 55%,transparent)}/* L'orbe de feu : un cœur blanc, une écorce d'ambre et une flamme qui bat autour. Seuls
   transform et opacity s'animent — le compositeur mène le vol sans le fil principal. */.orbe-vol.feu{background:radial-gradient(circle at 38% 34%,#fff6e0 0 16%,#ffce5e 36%,var(--orbe) 62%,transparent 74%);box-shadow:0 0 16px 6px var(--orbe),0 0 46px 18px #ff5a1e5c}.orbe-vol.feu::after{content:'';position:absolute;inset:-22%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 66%,#ffb14ab3,#ff5a1e4d 45%,transparent 72%);animation:flamme .26s ease-in-out infinite alternate}@keyframes flamme{from{transform:scale(.86) rotate(-9deg);opacity:.7}to{transform:scale(1.2) rotate(10deg);opacity:1}}@media(prefers-reduced-motion:reduce){.orbe-vol.feu::after{animation:none}}/* Un envoi refusé se voit sur le bouton de la table. */#open-live[data-souci]{color:#b8483a;border-color:#b8483a}</style><link rel="stylesheet" href="./editor.css?v=0.273"></head><body>

 refY="8.5" orient="auto"><path d="M0 .9 19 8.5 0 16.1 5.6 8.5Z" fill="#8b969b"/></marker></defs><path id="aim-arrow" class="aim-fleche"/></svg><div id="marquee" hidden aria-hidden="true"></div><div id="floaters" aria-hidden="true"></div></div></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* Une erreur pendant le chargement laissait le voile sans un mot : il dit désormais laquelle. */
window.addEventListener('error',e=>{const c=document.getElementById('busy-cover');if(!c||c.hidden)return;
 const ou=e.filename?' ('+e.filename.split('/').pop().split('?')[0]+':'+e.lineno+')':'';
 c.textContent='Le chargement a échoué : '+(e.message||'erreur inconnue')+ou+'. Recharge la page ; si ça se reproduit, transmets ce message.'});
function escapeName(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const actors=[{name:'Éla',role:'Gardienne · niveau 1',hero:true,hp:18,max:24,def:3,dmg:2,x:38,y:69,skills:[2,3,1,2,4,1,2,1]},{name:'Kaël',role:'Chasseur · niveau 1',hero:true,hp:16,max:18,def:2,dmg:3,x:57,y:76,skills:[4,2,1,3,2,2,1,2]},{name:'Sentinelle',role:'Adversaire standard',hero:false,hp:12,max:12,def:3,dmg:2,x:41,y:34,skills:[1,3,1,2,3,1,1,1]},{name:'Rôdeur des ruines',role:'Adversaire solitaire',hero:false,hp:20,max:20,def:4,dmg:3,x:66,y:42,skills:[3,2,1,3,2,3,1,1]}];
/* Couleurs officielles des dés d’Amertume. Lourd, Mystique et Mortel sont des faces
   sombres : leur chiffre et leur pastille passent en clair. */
const colors=['#ece7db','#dcb87f','#c0392b','#3f7bc0','#5fa45f','#2b2b2b','#d8c13a','#b84ec0'];
const DARK_DIE=[2,3,5,7];const types=['Simple','Léger','Lourd','Mystique','Soin','Mortel','Phase','Faille'];const skillNames=COMPETENCES;let selected=0,round=1,mapUrl,view="mj",owner=0,maps=[],currentMapId=null,tokensLocked=false;
/* Deux temps de jeu. En exploration, la troupe avance, ouvre, fouille : ni tour ni
   Mouvement compté. L'Action, elle, se dépense dans les deux temps chez un joueur — un
   coup porté hors combat est dépensé jusqu'à ce que le MJ lance le combat ou le rende
   d'un clic droit. Le combat remet le tour à un et rend à chacun son Action et son
   Mouvement. */
let mode='exploration';
const enCombat=()=>mode==='combat';
actors.forEach(a=>{a.target=null;a.checks=[0,0,0];a.orbes=0;a.pool=[2,0,1,0,0,0,0]});
const PLAN=[[[80,55],[310,55],[310,90],[115,90],[115,205],[80,205]],[[490,55],[720,55],[720,215],[685,215],[685,90],[490,90]],[[80,315],[115,315],[115,395],[320,395],[320,430],[80,430]],[[515,395],[685,395],[685,305],[720,305],[720,430],[515,430]],[[260,195],[305,195],[305,240],[260,240]],[[495,195],[540,195],[540,240],[495,240]],[[375,320],[425,320],[425,365],[375,365]]];
const WALLS=PLAN.map(poly=>poly.map(([x,y])=>[x/8,y/4.8]));
PLAN.forEach(poly=>{const el=document.createElementNS('http://www.w3.org/2000/svg','polygon');el.setAttribute('points',poly.map(pt=>pt.join(',')).join(' '));document.querySelector('.plan .walls').append(el)});
// Une carte importée n'a pas encore d'obstacles définis : le plan schématique est masqué.
function walls(){return typeof activeObstacles==='function'?activeObstacles():$('map').classList.contains('custom')?[]:WALLS.map(p=>({contours:[p]}))}
let mursPxTache=null;
function wallsInPixels(px){const formes=walls(),size=mapSize(),cle=size.width+'x'+size.height;
 if(mursPxTache&&mursPxTache.formes===formes&&mursPxTache.cle===cle)return mursPxTache.polys;
 const polys=formes.map(s=>({contours:(s.contours||[s]).map(c=>c.map(([x,y])=>px(x,y)))}));
 mursPxTache={formes,cle,polys};setTimeout(()=>{mursPxTache=null},0);
 return polys}
function controlled(i){return view==="mj"||i===owner}
// Le MJ peut figer la table : les joueurs regardent, les tokens ne bougent plus.
/* Gel et Au sol clouent un combattant sur place. Comme pour le verrou des déplacements,
   le MJ passe outre : c'est lui qui arbitre, et il a souvent besoin de replacer un socle. */
function canMove(i){return controlled(i)&&(view==="mj"||(!tokensLocked&&!frozenSolid(actors[i])))}
/* Un dé d'effet ne se défend pas : ni DEF, ni blindage, ni saignée. Il se voit sur la
   carte et se raconte au journal, comme un jet d'attaque. Un état empilé en lance autant
   que de crans — trois crans de Feu, trois dés de brûlure — et c'est leur somme qui porte. */
function effectDice(a,couleur,crans){const jets=Array.from({length:Math.max(1,crans|0)},()=>d6());
 rollOnBoard(jets.map(v=>[v,couleur]),a,a);
 return {jets,total:jets.reduce((s,v)=>s+v,0)}}
// « Dé noir 4 » pour un seul cran, « dés noirs 4 + 2 + 5 = 11 » quand l'état s'est empilé.
function ditLesJets(nom,j){return j.jets.length<2?'dé '+nom+' '+j.total
 :'dés '+nom+'s '+j.jets.join(' + ')+' = '+j.total}
function afterAction(a){if(!a||!alive(a))return;
 if(hasState(a,'Poison')){const j=effectDice(a,5,compteEtat(a,'Poison'));
  const perdu=applyDamage(a,j.total);floatNumber(a,'−'+perdu,'perte');
  log(a.name+' · Poison : '+perdu+' PV perdus ('+ditLesJets('noir',j)+').'+(a.hp===0?' 💀':''),{dice:true,ton:'degats'})}
 if(hasState(a,'Vie')&&alive(a)){const j=effectDice(a,4,1);const gagne=applyHeal(a,j.total);floatNumber(a,'+'+gagne,'gain');
  log(a.name+' · Vie : '+gagne+' PV rendus (dé vert '+j.total+').',{dice:true,ton:'soin'})}}
function afterMove(a){if(!a||!alive(a)||!hasState(a,'Foudre'))return;
 const size=mapSize(),token=tokenOf(a);
 const murs=walls();
 const touches=actors.filter(o=>alive(o)&&(o===a||(size.width&&inContact(a,o,size,token,tokenOf(o))&&!wallsBetween(a,o,murs))));
 if(!touches.length)return;
 const j=effectDice(a,3,compteEtat(a,'Foudre'));
 const dits=touches.map(o=>{const perdu=applyDamage(o,j.total);floatNumber(o,'−'+perdu,'perte');return o.name+' −'+perdu+(o.hp===0?' (coma)':'')});
 log(a.name+' · Foudre : '+ditLesJets('bleu',j)+' sur '+touches.length+' combattant(s) — '+dits.join(', ')+'.',{dice:true,ton:'etat'})}
/* Le feu brûle au passage du tour, une fois par combattant qui le porte. */
function burnAll(){const brules=actors.filter(o=>alive(o)&&hasState(o,'Feu'));
 brules.forEach(o=>{const crans=compteEtat(o,'Feu');
  const jets=Array.from({length:crans},()=>d6()),total=jets.reduce((s,v)=>s+v,0);
  const perdu=applyDamage(o,total);floatNumber(o,'−'+perdu,'perte');
  log(o.name+' · Feu : '+perdu+' PV perdus ('+ditLesJets('noir',{jets,total})+').'+(o.hp===0?' 💀':''),{dice:true,ton:'degats'})});
 return brules.length}
/* Poser un état passe par ici : l'Onde purge ou absorbe avant que l'état ne s'installe. */
function inflictState(a,etat){
 if(ONDE_EXCLUS.includes(etat)){setState(a,etat,true);return etat+' posé.'}
 if(hasState(a,'Onde')){setState(a,'Onde',false);
  return 'Onde consumée : '+etat+' est ignoré.'}
 setState(a,etat,true);return etat+' posé.'}
function alive(a){return a.hp>0&&!hasState(a,"Coma")}
function ratio(a){return Math.max(0,Math.min(100,100*a.hp/Math.max(1,a.max)))}
function lifebar(pct,label,hero){return '<span class="lifebar'+(hero?'':' foe')+(pct<35?' low':'')+'"><span class="lifebar-fill" style="width:'+pct+'%"></span><span class="lifebar-text">'+escapeName(label)+'</span></span>'}
const TOKEN_FRACTION=46/810;
/* L'échelle d'une carte : la largeur d'un socle moyen, en pour cent de la largeur de la
   carte. Toutes les cartes ne sont pas au même pas — un couloir de donjon et un plan de
   ville ne se mesurent pas pareil —, elle se règle donc carte par carte, au socle témoin
   de l'éditeur. Une carte qui n'en dit rien garde la mesure d'origine. */
const SOCLE_DEFAUT=100*TOKEN_FRACTION;
function echelleSocle(m){const v=Number(m&&m.echelle&&m.echelle.t);
 return Number.isFinite(v)&&v>=.6&&v<=40?v:SOCLE_DEFAUT}
function echelleCarte(){return echelleSocle(typeof currentMap==='function'?currentMap():null)}
/* La carte n'a aucune largeur tant qu'un autre onglet est affiché : mesurée à cet
   instant, elle réduirait tous les socles au minimum. On garde donc la dernière
   largeur connue plutôt que de retomber sur le plancher. */
let dernierToken=46;
function tokenPx(){const w=mapSize().width;if(w>10)dernierToken=Math.max(12,w*echelleCarte()/100);return dernierToken}
// Le socle d'un combattant donné, en pixels : c'est lui qui vaut pour ses portées.
function tokenOf(a){return tokenPx()*socleFacteur(a)}
function mapSize(){const r=$('map').getBoundingClientRect();return {width:r.width,height:r.height}}
// Zoom de la table : seule la vue est transformée, les coordonnées restent en pourcentages.
let mapZoom=1,mapPanX=0,mapPanY=0,panDrag=null;
function applyMapZoom(){const m=$('map'),w=m.clientWidth||1,h=m.clientHeight||1;
 if(mapZoom<=1){mapPanX=(1-mapZoom)*w/2;mapPanY=(1-mapZoom)*h/2}
 else{mapPanX=Math.min(0,Math.max(-(mapZoom-1)*w,mapPanX));mapPanY=Math.min(0,Math.max(-(mapZoom-1)*h,mapPanY))}
 $('map-view').style.transform='translate('+mapPanX+'px,'+mapPanY+'px) scale('+mapZoom+')';
 $('zoom-label').textContent=Math.round(mapZoom*100)+' %';repeindreFog()}
/* La finesse du brouillard suit le zoom : il faut donc le repeindre quand celui-ci change.
   Une seule repeinte par image, sinon une molette continue en réclamerait cent. */
let fogRepeint=0,fogZoomPeint=-1;
function repeindreFog(){if(typeof renderFog!=='function')return;
 /* Seule la finesse dépend du zoom : un panoramique ne la change pas. Sans cette garde,
    chaque pixel de déplacement redemandait une toile de quatre mille pixels — d'où le
    déplacement qui accrochait dès qu'on avait zoomé. */
 if(fogZoomPeint===mapZoom)return;
 fogZoomPeint=mapZoom;
 if(fogRepeint)return;
 fogRepeint=requestAnimationFrame(()=>{fogRepeint=0;renderFog()})}
function zoomMapAt(facteur,cx,cy){const z=Math.min(8,Math.max(.4,mapZoom*facteur));
 mapPanX=cx-(cx-mapPanX)*z/mapZoom;mapPanY=cy-(cy-mapPanY)*z/mapZoom;mapZoom=z;applyMapZoom()}
function resetMapZoom(){mapZoom=1;mapPanX=mapPanY=0;applyMapZoom()}
/* La bonne distance de lecture ne se dit pas en pourcentage. Chaque carte a son échelle
   et chaque fenêtre sa taille : le même pourcentage montre ici un socle minuscule, là un
   socle énorme. On vise donc une taille de socle à l'écran, et le grossissement s'en
   déduit — la carte peut changer, la fenêtre aussi, le socle garde sa taille.
   C'est le socle moyen qui sert de mesure, et non celui qu'on a cliqué : la distance est
   une propriété de la carte, pas de la créature, et deux double-clics de suite ne doivent
   pas faire respirer la vue selon qu'on vise un rat ou un colosse.
   Le cadre garde un mot à dire : sur une petite fenêtre, un socle ne prend jamais plus du
   quart de la hauteur, sans quoi il ne resterait rien autour de lui à regarder. */
const SOCLE_APPROCHE=85;
function zoomApproche(){const t=tokenPx(),h=$('map').clientHeight||1;
 if(!(t>0))return mapZoom;
 return Math.min(8,Math.max(1,Math.min(SOCLE_APPROCHE,h*.2)/t))}
/* Double-clic sur un socle : la carte s'approche à cette distance et le socle vient au
   milieu du cadre. Déjà plus près à la main, on n'éloigne pas — on se contente de
   recadrer, sinon le geste défairait le réglage qu'on venait de faire. Le bord de la
   carte retient le cadrage : un socle contre un mur ne se centre pas tout à fait, mais
   la carte ne laisse jamais de vide. */
function approcherToken(a){if(!a)return;
 const m=$('map'),w=m.clientWidth||1,h=m.clientHeight||1;
 mapZoom=Math.max(mapZoom,zoomApproche());
 mapPanX=w/2-a.x/100*w*mapZoom;mapPanY=h/2-a.y/100*h*mapZoom;
 applyMapZoom()}
// Repère du pointeur dans la carte, indépendant du zoom.
function mapPct(e){const r=$('map-view').getBoundingClientRect();
 return {x:100*(e.clientX-r.left)/r.width,y:100*(e.clientY-r.top)/r.height}}
function activeAttack(a){return chosenAttack(a,items())}
// Le catalogue vit dans editor.js, chargé après ce script : accès défensif.
function items(){return typeof catalog!=='undefined'&&catalog?catalog.items||[]:[]}
function gear(id){return items().find(w=>w.id===id)}
function diceToPool(dice){return dice?DICE_KEYS.map(k=>Math.max(0,Math.min(12,Number(dice[k])||0))):null}
// L'équipement fait foi ; à défaut, les valeurs propres du combattant (monstres).
function poolOf(a){return diceToPool(activeAttack(a).dice)||a.pool||[0,0,0,0,0,0,0]}
function rangeOf(a){return activeAttack(a).range||'contact'}
function defOf(a){return defenseOf(a,items())+bonusFiche(a).def+auraMeneur(a,'def')}
/* ---------- Les caractéristiques telles qu'elles jouent ----------
   La fiche, plus les nœuds de bonus appris dans l'arbre, plus ce qu'un Meneur allié
   confère à portée. La fiche garde ses valeurs propres : c'est à la lecture que tout s'ajoute. */
function bonusFiche(a){return bonusDe(a,typeof catalog!=='undefined'?catalog.talents:[],items())}
function degatsDe(a){return (Number(a&&a.dmg)||0)+bonusFiche(a).dmg+auraMeneur(a,'dmg')}
function competenceDe(a,k){return (Number(a&&a.skills&&a.skills[k])||0)+(bonusFiche(a).skills[k]||0)}
function vieAffichee(a){return vieDe(a,typeof catalog!=='undefined'?catalog.talents:[],items())}
function enduAffichee(a){return enduDe(a,typeof catalog!=='undefined'?catalog.talents:[],items())}
/* Ce qu'un Meneur allié confère à ce combattant : chaque meneur vivant du même camp
   retient, parmi ses alliés à la portée réglée — au contact, ou en ligne de vue sans mur
   ni socle entre eux —, les plus proches : un, deux ou tous ; si celui-ci en est, la
   valeur s'ajoute. Sans carte mesurée, personne n'est à portée de personne. */
function auraMeneur(a,quoi){if(!a||typeof actors==='undefined'||typeof talentsCodes!=='function')return 0;
 const size=mapSize();if(!size.width)return 0;let total=0,murs=null;
 actors.forEach(m=>{if(m===a||!alive(m)||m.hero!==a.hero)return;
  talentsCodes(m).forEach(({code,params})=>{if(code.cle!=='meneur'||(params.quoi||'dmg')!==quoi)return;
   murs=murs||walls();
   const candidats=actors.filter(o=>o!==m&&alive(o)&&o.hero===m.hero&&aPorteeMeneur(m,o,params.portee,size,murs))
    .map(o=>({a:o,dist:tokenDistance(m,o,size)}));
   if(elusMeneur(params,candidats).includes(a))total+=Math.max(1,params.valeur|0)})});
 return total}
function aPorteeMeneur(m,o,portee,size,murs){if(wallsBetween(m,o,murs))return false;
 if(portee==='vue')return hasLineOfSight(m,o,actors.filter(x=>x!==m&&x!==o&&alive(x)),size,tokenPx());
 return inContact(m,o,size,tokenOf(m),tokenOf(o))}
// Contact : la cible doit être dans le disque affiché. Distance : ligne de vue non traversée.
/* La portée, pour n'importe quelle cible et pas seulement celle qui est désignée : c'est
   ce qui permet de lister d'un coup tout ce qui est atteignable. « rang » exclut la cible
   testée de ceux qui pourraient masquer la vue — on ne se cache pas soi-même. */
function reachTo(a,b,rang,portee){const size=mapSize();if(!size.width)return {ok:true,ranged:false,text:''};const token=tokenPx();
 if((portee||rangeOf(a))==='distance'){if(wallsBetween(a,b,walls()))return {ok:false,ranged:true,text:'ligne de vue bloquée par '+(typeof obstacleLabel==='function'?obstacleLabel(a,b):'un mur')};
  const blocked=sightBlockers(a,b,actors.filter((o,j)=>j!==selected&&j!==rang&&alive(o)),size,token);return {ok:!blocked.length,ranged:true,text:blocked.length?'ligne de vue bloquée par '+blocked[0].name:'ligne de vue dégagée'}}
 /* Au contact aussi, la matière compte : un bras ne traverse pas une cloison. L'aura
    dessinée s'arrête au mur depuis la v0.98 — la règle en dit autant. */
 const proche=inContact(a,b,size,tokenOf(a),tokenOf(b));
 const mur=proche&&wallsBetween(a,b,walls());
 const ok=proche&&!mur;
 return {ok,ranged:false,mur,text:ok?'à portée de contact':mur?'un mur s’interpose':'hors du rayon de contact'}}
function reach(){const a=actors[selected],j=a?ciblesDe(a)[0]:undefined;if(j===undefined)return null;return reachTo(a,actors[j],j)}
/* ---------- Les cibles d'un combattant ----------
   Une seule d'ordinaire ; un talent passif — Double attaque — en autorise davantage.
   « target » reste la première : la flèche, le liseré et l'Analyse la lisent, et n'ont pas
   à connaître les autres. « targets » porte la liste entière, dans l'ordre où elle a été
   désignée. */
function ciblesMax(a){return ciblesPermises(typeof talentsCodes==='function'?talentsCodes(a):[])}
function cibleValide(a,j){const o=(j===null||j===undefined)?null:actors[j];
 return !!(o&&o!==a&&alive(o)&&!(o.hidden&&view!=='mj')&&!invisiblePour(o,j))}
function ciblesDe(a){if(!a)return [];
 const brut=Array.isArray(a.targets)?a.targets
  :(a.target===null||a.target===undefined?[]:[a.target]);
 return brut.filter((j,k,l)=>l.indexOf(j)===k&&cibleValide(a,j)).slice(0,ciblesMax(a))}
function poseCibles(a,liste){if(!a)return;
 a.targets=liste.slice();a.target=liste.length?liste[0]:null}
/* Il suffit d'appuyer sur le bouton d'attaque : sans cible désignée, on prend celle qui
   s'impose — la seule à portée, ou les premières dans l'ordre canonique (les plus
   proches ; à égalité sbires, Élites, Solitaires, Boss ; puis le numéro du socle).
   Désigner d'abord reste possible, et c'est ainsi qu'on concentre les coups sur l'une
   plutôt que l'autre. */
function cibleAutomatique(a,portee){
 return reachableTargets(portee).filter(j=>actors[j]&&actors[j].hero!==a.hero).slice(0,ciblesMax(a))}
/* Ce qui empêche un coup de partir. Chaque bouton d'Action pose la question pour sa
   propre attaque : seule la portée change d'une attaque à l'autre, le reste est commun.
   Chaîne vide = le coup part. */
/* Chez un joueur, l'Action se dépense : un coup ou un talent d'attaque, et la rangée se
   grise jusqu'au tour suivant — en combat comme en exploration, un point dépensé est
   dépensé. Le MJ n'est pas tenu ; les orbes sont gratuits. */
/* Une bille par point qui reste — Action en bleu, Mouvement en ambre — et rien du tout
   quand il n'en reste plus. Hors combat, le Mouvement ne se compte pas. */
function pastillesPoints(a){if(!a)return '';
 const bille=(classe,n)=>{let s='';for(let k=0;k<n;k++)s+='<i class="pt '+classe+'"></i>';return s};
 const act=alive(a)?pointsRestants(a,'action'):0;
 const mvt=alive(a)&&enCombat()?pointsRestants(a,'mouvement'):0;
 return bille('action',act)+bille('mvt',mvt)}
function actionPrise(a){return view!=='mj'&&!!a&&pointsRestants(a,'action')<=0}
/* Se déplacer ou analyser : c'est le même point de Mouvement. Un joueur qui a bougé ne
   peut plus analyser ce tour ; le MJ n'est pas tenu. */
function mouvementPris(a){return view!=='mj'&&enCombat()&&!!a&&pointsRestants(a,'mouvement')<=0}
function refusAttaque(a,at){
 if(!a)return 'Aucun combattant actif.';
 if(actionPrise(a))return 'Action déjà dépensée ce tour.';
 if(!alive(a))return 'Un combattant dans le coma ne peut pas agir.';
 if(hasState(a,'Au sol'))return 'Au sol : aucune Action possible.';
 const loin=((at&&at.range)||rangeOf(a))==='distance';
 if(blinded(a)&&loin)return 'Aveugle : ni arme à distance ni sort.';
 const portee=loin?'distance':'contact';
 /* Le bouton reste offert tant que quelqu'un est à portée : une cible désignée qui l'est
    encore, sinon n'importe quel adversaire au contact ou en vue. Une désignation devenue
    lointaine ne grise plus rien — le coup partira sur qui est là. */
 /* Un allié désigné — le protégé d'un Gardien — ne compte pas ici : on n'attaque jamais un
    allié, sa désignation ne grise donc rien, et le coup part sur l'adversaire à portée. */
 const vises=ciblesDe(a).filter(j=>actors[j]&&alive(actors[j])&&actors[j].hero!==a.hero);
 if(ciblesAtteignables(a,vises,portee).length||cibleAutomatique(a,portee).length)return '';
 return loin?'Aucune cible en vue.':'Aucun adversaire à portée de contact.'}
// Parmi des cibles, celles que l'attaque peut atteindre : au contact, ou en ligne de vue.
function ciblesAtteignables(a,liste,portee){return liste.filter(j=>{const b=actors[j];if(!b)return false;const r=reachTo(a,b,j,portee);return !r||r.ok})}
/* Tout ce que le combattant actif peut désigner : vivant, visible pour qui regarde, et
   à sa portée. Alliés compris — on vise aussi pour soigner, ou pour montrer une cible. */
/* Les cibles offertes paraissent dans l'ordre où les règles les prennent : les plus
   proches ; à égalité sbires, Élites, Solitaires, Boss ; puis le numéro du socle. */
function reachableTargets(portee){const a=actors[selected];if(!a||!alive(a))return [];
 return ordreCibles(actors.map((o,j)=>[o,j]).filter(([o,j])=>{
  if(j===selected||!alive(o))return false;
  /* Ce que la troupe ne voit pas n'est pas une cible : ni pour un joueur, ni pour un
     aventurier que le MJ joue — sinon, la cible morte, le coup partait sur un adversaire
     encore caché dans une autre salle. Le MJ peut toujours le désigner à la main. */
  if(cachePour(o,j)&&(view!=='mj'||a.hero))return false;
  return reachTo(a,o,j,portee).ok}),a,mapSize()).map(([,j])=>j)}
/* Les rayons de contact : ceux de la sélection — l'actif, ou tout un lot — et, chez un
   joueur, celui du combattant qu'il inspecte. Ils ne dépendent pas de l'attaque retenue :
   un archer menace le contact autour de lui comme un autre, et c'est ce qu'il faut lire
   pour les attaques d'opportunité. Le bouton Contacts les montre tous d'un coup — les
   aventuriers et les adversaires révélés, comme s'ils étaient tous sélectionnés. */
let porteesOn=localStorage.getItem('amertume-portees')==='1';
/* Ce qu'un joueur regarde sans le contrôler : un identifiant, jamais un rang, pour
   survivre aux allées et venues de la liste. Null : il ne regarde que son actif. */
let inspecteId=null;
function inspecteIndex(){return view==='mj'||inspecteId===null?-1:actors.findIndex(a=>a&&a.id===inspecteId)}
function porteurs(){
 const tous=porteesOn?actors.map((a,i)=>i).filter(i=>{const a=actors[i];return a.hero||(a.vu&&!a.hidden)})
  :(marked.size>1?markedIndexes():(selected===null?[]:[selected]));

  if(!a||!alive(a))return false;
  return !(cachePour(a,i)&&view!=='mj')})}
let auraCache={formes:null,cle:'',pts:new Map()};
function updateRing(){const couche=$('contact-ring');couche.hidden=false;
 /* Chaque aura prend la mesure de son propre socle, et la matière la découpe : un mur
    arrête le bras comme il arrête le regard, elle s'arrête donc net contre lui. */
 const size=mapSize(),formes=typeof walls==='function'?walls():[];
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
 /* Une aura ne se recalcule que si son socle, la carte ou le cadre ont bougé : pendant un
    glissement, seuls les socles en main coûtent, pas les vingt autres à l'écran. */
 if(auraCache.formes!==formes||auraCache.cle!==size.width+'x'+size.height){auraCache={formes,cle:size.width+'x'+size.height,pts:new Map()}}
 // Pendant un geste, l'aura du socle en main se dessine à demi-finesse ; au lâcher, elle reprend la pleine.
 const rayons=window.socleEnMain?40:72;
 porteurs().forEach(([a,i])=>{
  const k=a.id+'|'+a.x+','+a.y+'|'+tokenOf(a)+'|'+rayons;
  let pts=auraCache.pts.get(k);
  if(!pts){pts=reachPolygon(a,formes,contactRadius(tokenOf(a)),size.width,size.height,rayons);if(auraCache.pts.size>=200)auraCache.pts.clear();auraCache.pts.set(k,pts)}
  if(pts.length<3)return;
  const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('class','portee'+(a.hero?'':' foe')+(i===selected?' actif':''));
  el.setAttribute('d','M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')+'Z');
  svg.append(el)});
 couche.replaceChildren(svg)}
function majPortees(){const b=$('portees');if(!b)return;
 b.classList.toggle('on',porteesOn);b.setAttribute('aria-pressed',porteesOn?'true':'false');
 b.title=porteesOn?'Contacts de tous les combattants : cliquer pour ne garder que la sélection':'Afficher les contacts de tous les combattants (aventuriers et adversaires révélés)';
 b.setAttribute('aria-label',b.title)}
/* Maj : le curseur en croix annonce le ciblage, sans trait qui traverse la carte. */
let aiming=false;
function showAim(){$('map').classList.toggle('aiming',!!aiming)}
function hideAim(){$('map').classList.remove('aiming')}
/* Flèche de ciblage : un arc partant du socle de l'attaquant et s'arrêtant au bord de
   celui de la cible, tant qu'une cible est désignée. Pleine si le coup peut partir,
   en pointillé sinon — hors de portée ou vue coupée. */
/* Autant de flèches que de cibles : le ciblage multiple se voit, il ne se devine pas.
   La première est celle du document ; les suivantes naissent au besoin et meurent avec
   la cible qu'elles montraient. */
function updateSight(){const svg=$('aim'),a=actors[selected],vises=ciblesDe(a);
 const fleches=[$('aim-arrow'),...svg.querySelectorAll('.aim-extra')];
 while(fleches.length<vises.length){const p=document.createElementNS(nsSVGaim,'path');
  p.setAttribute('class','aim-fleche aim-extra');svg.append(p);fleches.push(p)}
 fleches.forEach((fleche,k)=>{
  if(k>=vises.length){fleche.classList.remove('on','etat-ok','etat-no','etat-done');
   if(k)fleche.remove();return}
  traceFleche(fleche,a,vises[k])})}
const nsSVGaim='http://www.w3.org/2000/svg';
function traceFleche(fleche,a,rang){
 const cible=actors[rang];
 if(!a||!cible||!alive(a)||!alive(cible)){fleche.classList.remove('on','etat-ok','etat-no','etat-done');return}
 const size=mapSize();if(!size.width)return;
 const ax=a.x/100*size.width,ay=a.y/100*size.height;
 const bx=cible.x/100*size.width,by=cible.y/100*size.height;
 const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
 if(len<4){fleche.classList.remove('on','etat-ok','etat-no','etat-done');return}
 const r=tokenOf(a)/2,ux=dx/len,uy=dy/len;
 /* Le trait et sa pointe prennent la mesure du socle : sur une carte à grande échelle,
    une flèche de trois pixels et demi barrerait la moitié de la salle. */
 const trait=Math.max(1.2,tokenOf(a)*.04);fleche.style.strokeWidth=trait.toFixed(2);
 ['shot-ok','shot-no','shot-done'].forEach(id=>{const m=$(id);if(!m)return;
  m.setAttribute('markerWidth',(19/3.4*trait).toFixed(1));
  m.setAttribute('markerHeight',(17/3.4*trait).toFixed(1))});
 /* Départ pile au bord du socle de l'attaquant — les deux pixels compensent le bout
    arrondi du trait — et pointe sur le bord de celui de la cible, la tête dépassant de
    trois pixels le bout du tracé. Socles presque collés : on garde une hampe minimale
    quitte à mordre un peu sur la cible, sinon il ne resterait rien à voir. */
 const debut=r+2;if(len<debut+12){fleche.classList.remove('on','etat-ok','etat-no','etat-done');return}
 let fin=len-(r+3);if(fin<debut+10)fin=Math.min(len-6,debut+10);
 const x1=ax+ux*debut,y1=ay+uy*debut,x2=ax+ux*fin,y2=ay+uy*fin;
 fleche.setAttribute('d','M'+x1.toFixed(1)+' '+y1.toFixed(1)+'L'+x2.toFixed(1)+' '+y2.toFixed(1));
 fleche.classList.add('on');
 const etat=aimState(rang);
 fleche.classList.remove('etat-ok','etat-no','etat-done');fleche.classList.add('etat-'+etat);

/* Trois états, dans cet ordre : l'Action passée éteint tout — le coup ne partira pas ce
   tour-ci, où que soit la cible ; sinon la distance ou la vue peuvent l'interdire ; sinon
   il part. Le bouton d'attaque, lui, donne la raison en toutes lettres. */
function aimState(rang){const a=actors[selected];

 const j=rang===undefined?a.target:rang;
 if(j===null||j===undefined||!actors[j])return 'done';
 const portee=reachTo(a,actors[j],j);return portee&&!portee.ok?'no':'ok'}
// Déplacement : le socle est repoussé hors des murs et glisse le long de l'obstacle.
/* Les socles qui tiennent la place autour d'un combattant, en pixels de carte : les
   vivants, jamais lui-même, jamais ceux qu'on déplace du même geste — un lot pris
   ensemble garde son ordre. « adverses » ne retient que le camp d'en face, celui qui
   barre le passage ; sans lui, tous les vivants, car on ne finit sur aucun. */
function soclesOccupes(a,size,ignorer,adverses){
 if(!a||!size||!size.width)return [];
 return actors.filter(o=>o!==a&&alive(o)&&!(ignorer&&ignorer.has(o.id))
   &&(!adverses||o.hero!==a.hero))
  .map(o=>({x:o.x/100*size.width,y:o.y/100*size.height,r:tokenOf(o)/2}))}
// Le MJ traverse les murs en tenant un token ; les joueurs, non.
function settleActor(a,ignorer){const size=mapSize();if(!size.width)return;
 const px=(x,y)=>[x/100*size.width,y/100*size.height];
 const polys=wallsInPixels(px),r=tokenOf(a)/2;
 /* Un corps à terre ne dérange personne et ne se fait pas déranger : il ne sort que des
    murs. Un vivant, lui, ne reste jamais à cheval sur un autre vivant. */
 const [x,y]=alive(a)
  ?poserHorsDesSocles(px(a.x,a.y),soclesOccupes(a,size,ignorer,false),polys,r)
  :slideOutOfWalls(px(a.x,a.y),polys,r);
 a.x=Math.max(4,Math.min(96,x/size.width*100));a.y=Math.max(5,Math.min(95,y/size.height*100))}
/* « ignorer » : les socles qu'on déplace du même geste ne se repoussent pas entre eux —
