/* Deux palettes, un seul jeu de règles : tout le décor passe par ces jetons, si bien

display:flex;align-items:center;gap:9px;text-align:left;margin:5px 0;padding:6px 8px;background:transparent}.actor strong{font-size:13px}.actor .avatar{width:26px;height:26px;font-size:15px}/* Deux pastilles au-dessus de la vignette : l'Action et le Mouvement qui restent. La

/* Chaque type d'adversaire porte sa couleur dans la liste des combattants : on lit d'un

.actor.k-standard{--type:#8d9794}

.actor.k-boss{--type:#9b6fb5}
.actor.enemy{border-left:3px solid var(--type,#cf8074)}/* La vignette entière prend la teinte pâle du type, celle du bestiaire ; la sélection garde la sienne. */.actor.enemy.k-standard:not(.selected){background:#dcd8cf}.actor.enemy.k-alpha:not(.selected){background:#efdcc2}.actor.enemy.k-solitaire:not(.selected){background:#e8d3cb}.actor.enemy.k-boss:not(.selected){background:#e2d0e8}body.sombre .actor.enemy:not(.selected){background:color-mix(in srgb,var(--type) 22%,var(--panel))}.actor-body{flex:1;min-width:0}.actor strong{display:block;font:700 14px 'Killam',Georgia,serif;letter-spacing:.3px}.actor small{font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:20px 0}/* Le numéro de tour se lit à côté de son intitulé, sur une seule ligne. *//* L'intitulé et le numéro se lisent d'un même souffle : même corps, même graisse, le
   numéro au bout de la ligne. Les boutons en dessous respirent et pèsent leur poids. */.turn-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px;flex-wrap:nowrap;white-space:nowrap}/* Chez un joueur, rien ne suit le titre du tour : ni marge, ni rangées vides. */body.vue-joueur .turn-head{margin-bottom:0}.side-actions:not(:has(button:not([hidden]))){display:none}body.vue-joueur .turn-actions:not(:has(button:not([hidden]))){display:none}.turn-head .eyebrow{font:700 15px/1 'Killam',Georgia,serif;letter-spacing:1.4px;text-transform:uppercase}#round[hidden]{display:none}.side-actions #start-combat{width:100%;height:40px;font:700 15px/1 system-ui}.side-actions #end-combat{width:100%;height:34px;font:600 13px/1 system-ui;color:var(--muted)}.turn{font:700 15px/1 'Killam',Georgia,serif;letter-spacing:1px;margin:0;color:var(--ink)}.checks{display:flex;gap:7px;flex-wrap:wrap}.checks label{font-size:14px;background:var(--panel-2);border-radius:5px;padding:7px;cursor:pointer}.checks input{accent-color:var(--accent)}/* Dégeler et Se relever sont des activations comme l'attaque : ils tiennent la même barre. *//* Les attaques offertes : voir .choix-attaque dans editor.css, chargé après. */.choix-attaques{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}.choix-attaques[hidden]{display:none}.attack-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.etat-actions{display:flex;gap:8px;flex-wrap:wrap}.etat-actions button{font-size:14px;padding:8px 14px}.etat-actions .btn-action{padding:8px 18px}.map-panel{padding:0;overflow:hidden}/* La barre de la carte tient sur deux rangées : en haut ce qui regarde la carte — son

/* Tout le monde a dépensé son Action : le tour appelle la suite. */
@keyframes appel-tour{0%,100%{box-shadow:0 0 0 0 rgba(160,120,60,0)}50%{box-shadow:0 0 0 5px rgba(160,120,60,.34)}}
#next.appelle{border-color:var(--accent);color:var(--accent);animation:appel-tour 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){#next.appelle{animation:none;box-shadow:0 0 0 3px rgba(160,120,60,.34)}}/* Icônes de brouillard : la barre de carte reste courte. */.icon-btn{padding:5px 9px;font-size:15px;line-height:1}.icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}#fog-bar{margin-left:2px}#zoom-label,#czoom-label{min-width:52px;text-align:center}.map{position:relative;margin-inline:auto;height:460px;background-color:var(--map-bg);overflow:hidden;isolation:isolate}/* Pas de will-change : Safari gardait l'image de la couche à l'échelle 1 et l'étirait, floue, jusqu'au rendu suivant. */#map-view{--token:46px;position:absolute;inset:0;transform-origin:0 0;background-image:linear-gradient(#84958a16 1px,transparent 1px),linear-gradient(90deg,#84958a16 1px,transparent 1px);background-size:5% 8.333%}.map .plan{width:100%;height:100%;position:absolute;inset:0;z-index:-1}.map.custom #map-view{background-size:100% 100%;background-position:0 0;background-repeat:no-repeat}.map.panning{cursor:grabbing}.map.custom .plan,.map.has-map .plan{display:none}/* Tout ce qui entoure un socle — liseré, ombre, halo, cerceau de cible, jauge de vie —
   se mesure sur lui. Une carte à grande échelle donne de petits socles : leurs parures
   rétrécissent avec eux au lieu de les noyer. */
.token{position:absolute;z-index:1;transform:translate(-50%,-50%);width:var(--token);height:var(--token);border:max(1px,calc(var(--token)*.036)) solid #9fc8b1;background:#284a40;border-radius:50%;font:bold calc(var(--token)*.47) 'Killam',Georgia;box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008;padding:0;touch-action:none;user-select:none}.token.enemy{background:#633e38;border-color:#d29180}/* L’actif se voit sur la carte quelle que soit son attaque. Le disque de contact, lui,
   ne paraît que pour une attaque au contact : il dit une portée, pas une sélection. */.token.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #9fc8b1d9}/* Le combattant qu'un joueur regarde : un halo ambre, distinct de sa sélection verte. */.placement #map{cursor:crosshair}.placement #map-view .token{pointer-events:none}.token.inspecte{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #e0c37ad9}.actor.inspecte{border-color:#c9a24a}#sheet.secret :is(#sheet-chips,#stats,#hpbar,#bloc-gear,#bloc-talents,#skills,.divider){display:none}.token.enemy.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #d29180d9}/* Un groupe se voit à son halo, comme l'actif : sur la carte, tous les pris sont pareils. */.actor.marked{border-color:var(--accent);background:var(--hover)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.dicebar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.die-input{flex:1;min-width:54px;text-align:center}.die-input label{display:block;font-size:12px;color:var(--muted);margin-top:5px}.die-input input{width:46px;height:44px;text-align:center;border:none;border-radius:11px;font:800 18px system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 3px 6px #0000005e}.dice-results{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;min-height:56px;padding:9px 11px;background:#0e1518;border:1px solid #ffffff12;border-radius:13px;box-shadow:inset 0 2px 5px #00000066}.result{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;font:800 18px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 3px 6px #0000005e}.result.dark{color:#f4f6f2}.bonus-chip{padding:7px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--accent);font:700 14px system-ui;white-space:nowrap}.summary{font-size:14px;color:var(--muted);margin-top:12px}.sheet{border-top:3px solid var(--accent)}.sheet h2.sheet-sous{margin:14px 0 8px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sheet-head h1{font-size:26px}#name{font-family:'Killam',Georgia,serif;letter-spacing:.5px}.sheet-class{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font:700 11px system-ui;letter-spacing:2px;white-space:nowrap}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}.chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(50px,1fr));gap:5px;margin:14px 0}#class{display:none}.stat-tile{background:rgba(var(--tint),.14);border:1px solid rgba(var(--tint),.34);border-radius:10px;padding:8px 3px;text-align:center;min-width:0;overflow:hidden}.stat-tile span{display:block;font:600 9px system-ui;letter-spacing:.8px;text-transform:uppercase;color:rgb(var(--tint));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-tile strong{display:block;font:700 22px/1.1 'Killam',system-ui;margin-top:5px;color:var(--ink);white-space:nowrap}.stat-tile small{display:block;margin-top:6px;font:600 9px/1 system-ui;letter-spacing:.6px;color:var(--muted);white-space:nowrap}.ecu{position:relative;display:block}.ecu img{width:100%;height:100%;display:block}
/* Au-delà du 6, le chiffre est posé sur l'écu vide, dans le creux du blason. */
.ecu b{position:absolute;inset:16% 0 24%;display:grid;place-items:center;font-family:'Killam',Georgia,serif;color:#101010}
.stat-tile .ecu b{font-size:17px}
/* Le jeton d'état, posé en bas à droite du socle, comme sur la table. */
/* Le numéro d'un homonyme : à droite du nom dans la liste, au coin haut gauche du socle. */
.actor-nom{display:flex;align-items:baseline;gap:6px;min-width:0}
/* Le nom garde le droit de passer à la ligne, et son accent celui de dépasser :
   « overflow:hidden » rognait le É d'Éla par le haut. Le numéro reste sur la première ligne. */
.actor-nom strong{flex:0 1 auto;min-width:0}
.actor .num{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--hover);border:1.5px solid var(--line);font:700 10px/1 system-ui;color:var(--ink);box-shadow:0 1px 2px #0000002e}
/* Le même jeton que dans la liste — même fond, même liseré, même chiffre — posé
   à l'intérieur du socle : au-dessus, il mordait sur la barre de PV. */
/* Un vrai rond : la boîte est carrée et le chiffre centré dedans. Une largeur minimale
   avec du remplissage donnait un ovale, puisque hauteur et largeur ne se suivaient pas. */
.token .numero{position:absolute;left:-6%;top:3%;display:grid;place-items:center;width:calc(var(--token)*.32);height:calc(var(--token)*.32);border-radius:50%;background:var(--hover);border:max(1px,calc(var(--token)*.024)) solid var(--line);color:var(--ink);font:700 calc(var(--token)*.19)/1 system-ui;z-index:3;pointer-events:none;box-shadow:0 1px 3px #00000059}
.token .etats{position:absolute;right:-6%;bottom:-6%;display:flex;flex-direction:row-reverse;gap:1px;z-index:2;pointer-events:none}
.token .etat{width:calc(var(--token)*.26);height:calc(var(--token)*.26)}/* L'ombre appartient au jeton, pas à son compte : portée par l'état entier, elle cernait le chiffre d'un liseré noir. */.token .etat img{filter:drop-shadow(0 1px 2px #000d)}
/* La barre de PV se pose sous le socle, jamais dessus : le jeton d'état la recouvre au
   besoin. Les joueurs ne lisent que la leur — pour les autres la barre reste pleine,
   comme dans la liste des combattants. */
/* La jauge est la même pour tous les socles, quel que soit celui qu'on joue : un fil, pas un bandeau. */#pv-layer{position:absolute;inset:0;z-index:3;pointer-events:none}#pv-layer .pv.unseen{visibility:hidden}#pv-layer .pv.dead{opacity:.45;filter:grayscale(1)}#pv-layer .pv.cachemj,#pv-layer .pv.veiled{opacity:.4}#pv-layer .pv.hors-carte{display:none}#pv-layer .pv.glisse{transition:left .18s linear,top .18s linear}#pv-layer .pv{position:absolute;transform:translate(-50%,-100%);margin-top:calc(var(--token) / -2 - 1.5px);width:calc(var(--token) * .96);height:3.2px;border-radius:999px;background:#211f1b;border:0;box-shadow:0 0 0 var(--ombre,1px) #0000008c;overflow:hidden;pointer-events:none}#pv-layer .pv.calee{margin:0}#pv-layer .pv.calee.glisse{transition:transform .18s linear}
#pv-layer .pv i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3d7f4b,#8ac96e)}
#pv-layer .pv.enemy i{background:linear-gradient(90deg,#c1512e,#e8ac4e)}
/* Un PNJ prend la couleur de son alignement, au socle comme à la barre de PV : bleu allié, ocre neutre ; adverse, celle des adversaires. */
.token.pnj.al-allie{background:#2b4466;border-color:#8fb6e0}.token.pnj.al-allie.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #8fb6e0d9}
.token.pnj.al-neutre{background:#5c4a1e;border-color:#dcc074}.token.pnj.al-neutre.selected{box-shadow:0 calc(var(--token)*.055) calc(var(--token)*.17) #0008,0 0 0 max(1px,calc(var(--token)*.04)) #ffffffee,0 0 calc(var(--token)*.22) calc(var(--token)*.07) #dcc074d9}
#pv-layer .pv.al-allie i,.lifebar.foe.al-allie .lifebar-fill{background:linear-gradient(90deg,#3a6ea8,#8cc0ef)}
#pv-layer .pv.al-neutre i,.lifebar.foe.al-neutre .lifebar-fill{background:linear-gradient(90deg,#a8841c,#ecd06a)}
.token .etat{position:relative}.token .etat img{width:100%;height:100%;display:block}.token .etat b{position:absolute;right:-10%;bottom:-16%;color:#fff;font:700 calc(var(--token)*.15)/1 system-ui;text-align:center}
.stat-tile .ecu{width:30px;height:36px;margin:5px auto 1px}
/* Le « + » des dégâts respire : sans cet écart il colle au chiffre. Le retrait de gauche
   compense l'interlettrage qui, lui, pousse aussi après le dernier caractère. */
.stat-tile.t-dmg strong{letter-spacing:4px;padding-left:4px;color:var(--red-mat)}.hp{display:flex;align-items:center;justify-content:space-between;gap:8px}/* Des paliers, pas un point à la fois : soigner un monstre de 33 PV se faisait à la main. */
.hp-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hp-buttons button{padding:5px 2px;font:600 13px system-ui}
/* Les retraits en rouge, les ajouts en vert, et les deux extrêmes pleins pour qu'on les
   trouve du premier coup d'œil : Mort en haut à gauche, Soin en bas à droite. */
.hp-buttons button.moins{color:var(--red-mat);border-color:var(--red-mat)}
.hp-buttons button.moins:hover{background:#a4442f1f}
.hp-buttons button.plus{color:var(--green);border-color:var(--green)}
.hp-buttons button.plus:hover{background:var(--sel)}

.pv-panel[hidden]{display:none}
.hp-buttons[hidden]{display:none}/* Le chiffre se centre par la boîte, pas par une hauteur de ligne : la bordure mangeait

lay:grid;grid-template-columns:1fr 1fr}.map{height:420px}}@media(max-width:700px){header{padding:15px}.brand{font-size:22px}.brand-online{font-size:11px;letter-spacing:5px}.intro{padding:15px;align-items:flex-start;flex-direction:column}.layout{padding:0 12px 16px;grid-template-columns:1fr}.left{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{padding:14px}.map-panel{padding:0}.left .panel{min-width:0}.actor{padding:5px 4px}.right{grid-column:auto;grid-template-columns:1fr}.map{height:350px}.intro h1{font-size:26px}.toolbar button{flex:1}footer{padding:0 15px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.view-controls select{width:auto;margin:0}.targeted{outline:3px solid #f07872!important;outline-offset:4px}.token.targeted{outline-width:max(1px,calc(var(--token)*.03))!important;outline-offset:calc(var(--token)*.05)!important}.actor.targeted{outline-offset:0}.target-box{margin:12px 0;padding:12px;border:1px solid #885650;border-radius:6px}.target-box select{margin:6px 0}.attack-info{color:var(--accent);font-size:14px}.rules{font-size:14px;color:var(--muted);margin-top:16px}.rules summary{cursor:pointer}.dead{opacity:.5}header{flex-wrap:wrap}.token{touch-action:none}#contact-ring{position:absolute;inset:0;z-index:0;pointer-events:none}#contact-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.portee{fill:#8bbd9c62;stroke:#9fc8b1e0;stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}.portee.foe{fill:#cf807462;stroke:#d29180e0}.toggle-portees{font:600 13px system-ui;padding:5px 11px;letter-spacing:.2px}#aim{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}/* Flèche de ciblage : bleue quand le coup peut partir, rouge quand la distance ou la vue   l'interdisent, grise quand l'Action est déjà passée. */#aim .aim-fleche{display:none;fill:none;stroke-linecap:round}#aim .aim-fleche.on{display:block}
/* La distance sur le trait de ciblage : un chiffre clair cerné de sombre, lisible sur toute carte. */

#aim .aim-dist.etat-ok{fill:#a9d2f7}#aim .aim-dist.etat-no{fill:#f6a59c}#aim .aim-dist.etat-done{fill:#d3d8da}#aim .aim-fleche.etat-ok{stroke:#3f7bc0;filter:drop-shadow(0 0 6px #3f7bc073)}#aim .aim-fleche.etat-no{stroke:#e0483c;stroke-dasharray:10 9;opacity:.8}#aim .aim-fleche.etat-done{stroke:#8b969b;stroke-dasharray:6 7;opacity:.6}.map.aiming,.map.aiming .token{cursor:crosshair}
/* Poser un état : clic droit sur le socle. Le menu est en position fixe et hors de la

#state-menu{position:fixed;z-index:60;display:grid;grid-template-columns:repeat(4,64px);gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px #0006}

#state-menu .vide{display:grid;place-items:center;font-size:17px;color:var(--muted)}/* Le voile tient sa propre ligne, sous les etats : ce n'est pas une affection. */#state-menu .menu-sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0 2px}#state-menu button.voile{grid-column:1/-1;grid-auto-flow:column;justify-items:start;align-items:center;justify-content:start;gap:9px;padding:7px 8px;font-size:12px}#state-menu button.voile .vide{width:22px;height:22px;font-size:15px}#state-menu button.voile.on{border-color:#e2ae72;background:#e2ae7226;color:var(--ink)}/* Deux voiles, deux raisons, deux dessins : le MJ voit d'un coup d'oeil s'il cache lui-meme un adversaire, ou si la troupe ne le voit simplement pas. Un troisieme trait, bleu, pour l'etat Invisible : celui-la, seul son joueur le voit encore. */.token.invisible-mj,.actor.invisible-mj{opacity:.55;outline:2px dashed #6fa8d0;outline-offset:2px}.token.veiled,.actor.veiled{opacity:.46;outline:2px dashed #e2ae72;outline-offset:2px}.token.cachemj,.actor.cachemj{opacity:.4;outline:2px solid #b06fd0;outline-offset:2px}.token.invisible-mj,.token.veiled,.token.cachemj{outline-width:max(1px,calc(var(--token)*.028));outline-offset:calc(var(--token)*.03)}/* Ajouter un combattant se fait au-dessus de la liste : deux boutons courts, nommés, pour ne pas confondre la troupe et ce qu'elle affronte. */.titre-outils{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ajout-combattant{flex:1;display:flex;gap:5px;justify-content:flex-end}.ajout-combattant button{white-space:nowrap;padding:3px 7px;font:600 11px system-ui;letter-spacing:0;border-radius:14px}.ajout-combattant #new-hero{color:var(--green);border-color:var(--green)}.ajout-combattant #new-monster{color:#c26a5a;border-color:#c26a5a}/* Un intitulé discret entre les deux camps : la troupe d'abord, ce qu'elle affronte ensuite. */.groupe-combattants{display:flex;align-items:center;gap:8px;margin:10px 0 3px;padding-top:9px;border-top:1px solid var(--line);font:600 10px system-ui;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}/* Le groupe replié : un chevron, et la liste qui se déplie dessous. */.groupe-replie{margin:0}.groupe-replie>summary{cursor:pointer;list-style:none;user-select:none}.groupe-replie>summary::-webkit-details-marker{display:none}.groupe-replie>summary::before{content:'▸';display:inline-block;width:11px;transition:transform .15s}.groupe-replie[open]>summary::before{transform:rotate(90deg)}/* Le jeton Onde devant « Adversaires à 100 % ». */.btn-ico{width:18px;height:18px;vertical-align:-4px;margin-right:3px}button.ajout-camp{margin-left:auto;flex:none;box-sizing:border-box;width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:50%;font:700 14px/1 system-ui;letter-spacing:0;color:var(--muted)}button.ajout-camp:hover{color:var(--accent);border-color:var(--accent)}/* L'Onde du camp : le même rond que le « + », l'image dedans ; le « + » garde le bord droit. */.ajout-camp.soin-camp{margin-left:auto}.ajout-camp.soin-camp+.ajout-camp{margin-left:0}.ajout-camp.repos-camp,.ajout-camp.vaincus-camp{margin-left:auto;font-size:11px}.ajout-camp.repos-camp+.ajout-camp.soin-camp,.ajout-camp.vaincus-camp+.ajout-camp.soin-camp{margin-left:0}.token.hors-carte,#pv-layer .pv.vaincu,#pv-layer .pv.enemy.dead,.token.vaincu .etats{display:none}.token.vaincu{opacity:.25;pointer-events:none}.soin-camp img{width:14px;height:14px;display:block;pointer-events:none}.groupe-combattants:first-child button.ajout-camp{color:var(--green)}button.ajout-camp[hidden]{display:none}#actors>.groupe-combattants:first-child{margin-top:0;padding-top:0;border-top:0}.voile-note{display:block;margin-top:2px;font:600 10px system-ui;letter-spacing:.2px;color:#c08a4e}.actor.cachemj .voile-note{color:#b06fd0}.token.unseen,.actor.unseen{visibility:hidden;pointer-events:none}/* Jamais révélé : un nom, un socle, rien d'autre. Révélé mais hors de vue : la ligne entière, pâlie. *//* Sans pastilles ni barre, le socle n'a plus à descendre pour leur faire place : il se remet à hauteur du nom. */.actor.inconnu{opacity:.72}.actor.inconnu .avatar{filter:grayscale(.6)}.actor.inconnu .vignette,.actor.inconnu .vignette .avatar{transform:none}.actor.inconnu .actor-nom{align-items:center}.actor.horsvue{opacity:.5}#map-shapes{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#fog{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}/* Le voile d'attente : opaque, au-dessus de tout, jusqu'à ce que le brouillard soit peint. */#voile-attente{position:absolute;inset:0;z-index:40;background:#06090b;pointer-events:none}#voile-attente[hidden]{display:none}/* Les portes se peignent au-dessus du brouillard : découvertes, elles restent lisibles. */#map-doors{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}#murs-elem{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}#murs-elem path{fill:none;stroke:var(--mur);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}#murs-elem .halo{stroke-width:12px;opacity:.32;animation:mur-pouls 1.6s ease-in-out infinite}#murs-elem .coeur{stroke-width:4px;filter:drop-shadow(0 0 3px var(--mur))}#murs-elem .zone{fill:var(--mur);fill-opacity:.16;stroke:none}#murs-elem .en-cours{stroke-dasharray:6 6;opacity:.8}#murs-elem .point{stroke-width:11px}#aim .mur-guide{fill:none;stroke:var(--mur);stroke-dasharray:9 7;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--mur))}#aim .mur-guide.trop-long{stroke:#e0483c;filter:none;opacity:.85}#aim .mur-dist{font-weight:700;font-family:system-ui,sans-serif;fill:#fff;stroke:#1d1b18d9;stroke-width:3px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}#aim .mur-dist.trop-long{fill:#f6a59c}@keyframes mur-pouls{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){#murs-elem .halo{animation:none}}
/* Les coffres, sous le brouillard : seule leur part en vue se découpe. */
#map-coffres{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#map-shapes .wall-group{opacity:.62}#map-shapes .wall-group path.fond{fill:#0b1114;stroke:none}/* À la table, la matière n'a pas de liseré : le premier passage ne peint rien. */#map-shapes .wall-group path.bord{fill:none;stroke:none}/* Une porte n'est jamais un bloc plein : close, un contour orange ; ouverte, le même en pointillé gris. */#map-doors .door{fill:none;stroke:#c98a4b;stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:.95;cursor:default;transition:stroke .12s,stroke-width .12s,filter .12s}#map-doors .door.open{stroke:#96a3a7;stroke-width:2;stroke-dasharray:7 6;opacity:.8}#map-doors .door.keyed{stroke:#f3d7a6;stroke-width:3.5}/* Un passage secret ne se dessine que pour le MJ tant qu'il est clos : un trait violet   en pointillé serré, pour ne pas le confondre avec une porte que la troupe voit. */#map-doors .door.secret{stroke:#b06fd0;stroke-width:3;stroke-dasharray:4 3}#map-doors .door.secret.open{stroke:#96a3a7;stroke-width:2;stroke-dasharray:7 6}#map-doors .door.secret.can-open:hover{stroke:#c98ae0;stroke-width:4;filter:drop-shadow(0 0 6px #b06fd099)}#map-doors .door.keyed.open{stroke:#b9c3c6;stroke-width:2.5}/* Survol d'une porte que l'on peut manœuvrer : elle s'allume. */#map-doors .door.can-open{cursor:pointer}#map-doors .door.can-open:hover{stroke:#f6d9a8;stroke-width:4;opacity:1;filter:drop-shadow(0 0 6px #e2ae7299)}#map-doors .door.can-open.open:hover{stroke:#dfe8ea;stroke-width:3.5}#map-shapes .startzone{fill:#8bbd9c;opacity:.12;stroke:#8bbd9c;stroke-width:2;stroke-dasharray:8 6}/* Le plateau à dés est hors du calque zoomé : les dés se posent au bas de la table
   visible, quel que soit le zoom ou le recadrage de la carte. */
/* La piste de dés : un panneau à droite des Actions, un tiers de la largeur, où les dés animés tombent — plus jamais sur la carte. */.actions-rangee{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:stretch}/* Le plateau des Dés a la hauteur du bloc Actions, quel que soit le nombre de dés : la rangée ne grandit jamais. */.piste-des{display:flex;flex-direction:column;gap:8px;height:220px;overflow:hidden auto}#dice-tray{position:relative;flex:1;min-height:110px;border-radius:12px;background:#0e1518;border:1px solid #ffffff12;box-shadow:inset 0 2px 6px #00000066;pointer-events:none;overflow:hidden}@media(max-width:700px){.actions-rangee{grid-template-columns:1fr}.piste-des{min-height:110px}}/* Un dé qui ne compte pas — double d'os, face de Faille — s'efface : gris, à demi transparent, sans ombre, un peu plus petit. */.board-die.barre{opacity:.35!important;filter:grayscale(1);box-shadow:none;transform:scale(.88)!important}/* Le « + » du critique et le bonus de dégâts, en Killam. *//* Les visages sur la piste : ronds, liserés à la couleur du camp. */.board-token{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#2a2622;color:#e7d9b8;font:800 16px 'Killam',Georgia,serif;border:2px solid #9fc8b1;box-shadow:0 2px 6px #000a;box-sizing:border-box}.board-token.adverse{border-color:#d29180}.board-token img{width:100%;height:100%;object-fit:cover;display:block}.board-plus{position:absolute;transform:translate(-50%,-50%);font:800 18px 'Killam',Georgia,serif;color:#e7d9b8;text-shadow:0 1px 2px #000c}.board-bonus{position:absolute;transform:translate(-50%,-50%);font:800 24px 'Killam',Georgia,serif;color:#e0604a;text-shadow:0 1px 2px #000c;white-space:nowrap}/* Un dé qui ne passe pas la DEF de la cible porte l'écu vide à son coin. */.board-die .rate{position:absolute;right:-7px;top:-7px;width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 1px 2px #000c)}
/* Les chiffres qui montent au-dessus d'un socle : ils vivent dans leur propre couche,
   sinon le redessin des tokens les emporterait au premier changement de PV. */
#floaters{position:absolute;inset:0;z-index:4;pointer-events:none}/* Le cadre de sélection : tracé au-dessus de la carte, transparent aux clics. */#marquee{position:absolute;z-index:4;pointer-events:none;border:1.5px dashed var(--accent);background:rgba(160,120,60,.13);border-radius:3px}#marquee[hidden]{display:none}
.floater{position:absolute;transform:translate(-50%,-50%);font:800 22px 'Killam',Georgia,serif;white-space:nowrap;text-shadow:0 2px 4px #000000b3,0 0 2px #0009}
.floater.perte{color:#f0705a}.floater.gain{color:#8fd77e}.floater.nul{color:#e7d9b8}.board-die{position:absolute;display:grid;place-items:center;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:11px;font:800 20px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -3px 5px #00000026,0 7px 16px #000000a6;will-change:transform}.board-die.dark{color:#f4f6f2}.journal-title{font:600 13px system-ui;letter-spacing:3px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}.journal{max-height:330px;display:flex;flex-direction:column;gap:9px;padding-right:4px}.journal li{border:0;padding:0}/* Les colonnes se calent sur la colonne centrale : la droite prend sa hauteur exacte et le journal y prend ce que la fiche lui laisse ; à gauche, les points de vie descendent au bas. */.stack.right.calee{min-height:0}.stack.right.calee>.panel{flex:none}.stack.right.calee>.panel:last-child{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;box-sizing:border-box}.stack.right.calee .journal{flex:1;min-height:0;max-height:none}.stack.right.calee .journal-title,.stack.right.calee .journal-chat{flex:none}/* Un seul lettrage pour les titres de blocs : petites capitales espacées, sans Killam. */.eyebrow,.turn-head .eyebrow,#titre-tour,.journal-title,.panel>h2,#carte-titre{font:600 13px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:2.5px;text-transform:uppercase}/* Actions et Dés partent de la même ligne : la carte des actions perd sa marge de rangée. *//* Le bloc Actions a une hauteur fixe, vide ou garni : la carte, calée dessus, ne bouge jamais ; un contenu plus haut défile à l'intérieur. */.actions-rangee>.attack-card{margin:0;height:220px;overflow:auto}.attack-card.vide #reveal,.attack-card.vide #attack-choices{display:none}#pv-panel.vide .hp-buttons button{opacity:.45;pointer-events:none}#sheet.vide #hpbar,#sheet.vide #bloc-gear,#sheet.vide .divider{display:none}#sheet.vide .sheet-head{min-height:34px}/* La fiche prend la hauteur de ce qu'elle montre — talents et équipement dépliés compris — et le journal, calé dessous, prend tout le reste. */#sheet{min-height:0}.j-entry{font-size:14px;line-height:1.45;color:var(--ink);white-space:pre-line}/* La flèche en vol : un trait sombre à pointe claire, tourné vers sa cible. *//* Le souffle d'un tir : une rafale claire et étirée, deux filets d'air par-dessus. *//* Les coups, lisibles et toujours les mêmes : au contact, un trait de balayage fend l'air sur la cible, puis un choc — un anneau qui s'élargit ; à distance, un projectile file en ligne droite du tireur à la cible, puis le même choc. Blanc cerné de sombre : visible sur toute carte. Chaque geste dure le même temps, au même rythme. */.vfx{position:absolute;pointer-events:none;z-index:5;will-change:transform,opacity;transform:translate(-50%,-50%)}.vfx svg{display:block;width:100%;height:100%;overflow:visible}.vfx-piege svg{filter:drop-shadow(0 0 6px #ff8a2acc)}.vfx-piege .souffle{fill:#ff7a1f;fill-opacity:.6;stroke:#ffc35a;stroke-width:4}.vfx-piege .coeur{fill:#fff4cf}
.vfx-choc .onde{fill:none;stroke:#fff6dc;stroke-width:7}.vfx-choc svg{filter:drop-shadow(0 0 1px #000d) drop-shadow(0 0 5px #ffc85acc)}.vfx-etincelles .gerbe{stroke:#fff6dc;stroke-width:4.5;stroke-linecap:round}.vfx-etincelles svg{filter:drop-shadow(0 0 1px #000d) drop-shadow(0 0 4px #ffc85acc)}.vfx-fleche{transform:none}.vfx-fleche .hampe-ombre{stroke:#000a;stroke-width:5;fill:none}.vfx-fleche .hampe{stroke:#f1e4c8;stroke-width:2.6;fill:none}.vfx-fleche .plume{fill:#b8452e;stroke:#0009;stroke-width:1}.vfx-fleche .pointe{fill:#e9eef2;stroke:#000b;stroke-width:1.2}.vfx-fleche svg{filter:drop-shadow(0 0 3px #fff8)}/* Le balayage d'un coup au contact : un arc d'air, clair au bord, qui tourne autour de l'attaquant. *//* La parole : le socle de qui parle, puis ses mots. */.j-chat{display:flex;align-items:flex-start;gap:8px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:7px;padding:4px 8px;margin:2px 0}.j-avatar{flex:none;width:24px;height:24px;border-radius:50%;overflow:hidden;background:#d9cfbd;color:#2a2118;display:grid;place-items:center;font:700 12px 'Killam',Georgia,serif}.j-avatar img{width:100%;height:100%;object-fit:cover;display:block}.j-avatar.mj{background:var(--accent);color:#fff}.j-corps{min-width:0}.j-texte{white-space:pre-wrap;overflow-wrap:anywhere}.journal-vider{margin-left:auto;font:600 11px system-ui;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.journal-vider:hover{color:var(--ink);border-color:var(--ink)}.journal-chat{display:flex;gap:6px;margin-top:8px;flex:none}.journal-chat input{flex:1;min-width:0;font:14px system-ui;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}.journal-chat button{flex:none;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--accent);cursor:pointer;font-size:14px}/* Un cartouche léger, de la couleur de l'action : bleu pour un coup, violet pour un talent, une analyse ou un orbe, vert pour un soin, rouge pour une perte, ambre pour un état, or pour une révélation, brun pour la carte. */.j-entry.ton{--ton:#3f7bc0;border:1px solid color-mix(in srgb,var(--ton) 30%,transparent);background:color-mix(in srgb,var(--ton) 7%,transparent);border-radius:7px;padding:3px 8px;margin:2px 0}.j-entry.ton-attaque{--ton:#3f7bc0}.j-entry.ton-talent{--ton:#8a63c9}.j-entry.ton-competence{--ton:#2f7d45}.j-entry.ton-soin{--ton:#2f8a63}.j-entry.ton-degats{--ton:#b8483a}.j-entry.ton-etat{--ton:#a2691f}.j-entry.ton-reveal{--ton:#9d7b1e}.j-entry.ton-carte{--ton:#8a6d3b}.ton-butin{--ton:#a8832c}.j-turn{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:5px 0 1px}.j-turn::before,.j-turn::after{content:"";flex:1;height:1px;background:var(--line)}.j-name{font-weight:700}.j-key{font-weight:700}.j-num{font-weight:800;color:#b4553a}.j-dice{opacity:.7}/* La ligne d'attaque : le logo de l'arme entre les deux noms, les dégâts cliquables, le détail des dés dessous. */.j-attaque .logo-equip{width:20px;height:20px;vertical-align:-5px;margin:0 1px;filter:drop-shadow(0 1px 1px #0006)}.j-degats{font-weight:800;color:#b4553a}.j-degats.cliquable{cursor:pointer;border-bottom:1px dashed currentColor}.j-degats.cliquable:hover,.j-degats.ouvert{color:#d0644a}.j-detail{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}.j-de{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;font:800 12px/1 system-ui;color:#1b2124;background-color:var(--die);background-image:linear-gradient(158deg,#ffffff66,#ffffff00 42%,#0000002e);box-shadow:inset 0 1px 0 #ffffff8c,inset 0 -2px 3px #00000026,0 2px 4px #0000005e}.j-de.dark{color:#f4f6f2}.j-de.barre{opacity:.35;filter:grayscale(1);box-shadow:none}.j-de.relance{margin-left:8px}.j-plus{font:600 12px system-ui;color:var(--muted)}.j-plus.total{font-weight:800;color:var(--ink)}.j-badge{display:inline-block;background:#8d3b32;color:#ffe6df;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px}
/* Le socle qui arrive du réseau glisse jusqu'à sa place. */.token.glisse{transition:left .18s linear,top .18s linear}/* L'orbe en vol : une bille lumineuse de la couleur de ses dés. */.orbe-vol{position:absolute;will-change:transform,opacity;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;background:radial-gradient(circle at 35% 35%,#fff9,var(--orbe) 55%,transparent 72%);box-shadow:0 0 14px 5px var(--orbe),0 0 44px 16px color-mix(in srgb,var(--orbe) 55%,transparent)}/* L'orbe de feu : un cœur blanc, une écorce d'ambre et une flamme qui bat autour. Seuls
   transform et opacity s'animent — le compositeur mène le vol sans le fil principal. */.orbe-vol.feu{background:radial-gradient(circle at 38% 34%,#fff6e0 0 16%,#ffce5e 36%,var(--orbe) 62%,transparent 74%);box-shadow:0 0 16px 6px var(--orbe),0 0 46px 18px #ff5a1e5c}.orbe-vol.feu::after{content:'';position:absolute;inset:-22%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 66%,#ffb14ab3,#ff5a1e4d 45%,transparent 72%);animation:flamme .26s ease-in-out infinite alternate}@keyframes flamme{from{transform:scale(.86) rotate(-9deg);opacity:.7}to{transform:scale(1.2) rotate(10deg);opacity:1}}@media(prefers-reduced-motion:reduce){.orbe-vol.feu::after{animation:none}}/* Un envoi refusé se voit sur le bouton de la table. */#open-live[data-souci]{color:#b8483a;border-color:#b8483a}</style><link rel="stylesheet" href="./editor.css?v=0.581"></head><body><div id="busy-cover">Chargement de la partie enregistrée…</div>

Height="17" refX="16" refY="8.5" orient="auto"><path d="M0 .9 19 8.5 0 16.1 5.6 8.5Z" fill="#3f7bc0"/></marker><marker id="shot-no" markerUnits="userSpaceOnUse" viewBox="0 0 19 17" markerWidth="19" markerHeight="17" refX="16" refY="8.5" orient="auto"><path d="M0 .9 19 8.5 0 16.1 5.6 8.5Z" fill="#e0483c"/></marker><marker id="shot-done" markerUnits="userSpaceOnUse" viewBox="0 0 19 17" markerWidth="19" markerHeight="17" refX="16" refY="8.5" orient="auto"><path d="M0 .9 19 8.5 0 16.1 5.6 8.5Z" fill="#8b969b"/></marker></defs><path id="aim-arrow" class="aim-fleche"/></svg><div id="marquee" hidden aria-hidden="true"></div><div id="floaters" aria-hidden="true"></div></div></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* Une erreur pendant le chargement laissait le voile sans un mot : il dit désormais laquelle. */
window.addEventListener('error',e=>{const c=document.getElementById('busy-cover');if(!c||c.hidden)return;
 const ou=e.filename?' ('+e.filename.split('/').pop().split('?')[0]+':'+e.lineno+')':'';
 c.textContent='Le chargement a échoué : '+(e.message||'erreur inconnue')+ou+'. Recharge la page ; si ça se reproduit, transmets ce message.'});
function escapeName(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const actors=[{name:'Éla',role:'Gardienne · niveau 1',hero:true,hp:18,max:24,def:3,dmg:2,x:38,y:69,skills:[2,3,1,2,4,1,2,1]},{name:'Kaël',role:'Chasseur · niveau 1',hero:true,hp:16,max:18,def:2,dmg:3,x:57,y:76,skills:[4,2,1,3,2,2,1,2]},{name:'Sentinelle',role:'Adversaire standard',hero:false,hp:12,max:12,def:3,dmg:2,x:41,y:34,skills:[1,3,1,2,3,1,1,1]},{name:'Rôdeur des ruines',role:'Adversaire solitaire',hero:false,hp:20,max:20,def:4,dmg:3,x:66,y:42,skills:[3,2,1,3,2,3,1,1]}];
/* Couleurs officielles des dés d’Amertume. Lourd, Mystique et Mortel sont des faces
   sombres : leur chiffre et leur pastille passent en clair. */
const colors=['#ece7db','#dcb87f','#c0392b','#3f7bc0','#5fa45f','#2b2b2b','#d8c13a','#b84ec0'];
const DARK_DIE=[2,3,5,7];const types=['Simple','Léger','Lourd','Mystique','Soin','Mortel','Phase','Faille'];const skillNames=COMPETENCES;let selected=0,round=1,mapUrl,view=vueChoisie()==='player'?'player':'mj',owner=0,maps=[],currentMapId=null,tokensLocked=false;
/* Deux temps de jeu. En exploration, la troupe avance, ouvre, fouille : ni tour ni
   Mouvement compté. L'Action, elle, se dépense dans les deux temps chez un joueur — un
   coup porté hors combat est dépensé jusqu'à ce que le MJ lance le combat ou le rende
   d'un clic droit. Le combat remet le tour à un et rend à chacun son Action et son
   Mouvement. */
let mode='exploration';
const enCombat=()=>mode==='combat';
actors.forEach(a=>{a.target=null;a.checks=[0,0,0];a.orbes=0;a.pool=[2,0,1,0,0,0,0]});
const PLAN=[[[80,55],[310,55],[310,90],[115,90],[115,205],[80,205]],[[490,55],[720,55],[720,215],[685,215],[685,90],[490,90]],[[80,315],[115,315],[115,395],[320,395],[320,430],[80,430]],[[515,395],[685,395],[685,305],[720,305],[720,430],[515,430]],[[260,195],[305,195],[305,240],[260,240]],[[495,195],[540,195],[540,240],[495,240]],[[375,320],[425,320],[425,365],[375,365]]];
const WALLS=PLAN.map(poly=>poly.map(([x,y])=>[x/8,y/4.8]));
PLAN.forEach(poly=>{const el=document.createElementNS('http://www.w3.org/2000/svg','polygon');el.setAttribute('points',poly.map(pt=>pt.join(',')).join(' '));document.querySelector('.plan .walls').append(el)});
// Une carte importée n'a pas encore d'obstacles définis : le plan schématique est masqué.
function walls(){return typeof activeObstacles==='function'?activeObstacles():$('map').classList.contains('custom')?[]:WALLS.map(p=>({contours:[p]}))}
let mursPxTache=null;
function wallsInPixels(px){const formes=walls(),size=mapSize(),cle=size.width+'x'+size.height;
 if(mursPxTache&&mursPxTache.formes===formes&&mursPxTache.cle===cle)return mursPxTache.polys;
 const polys=formes.map(s=>({contours:(s.contours||[s]).map(c=>c.map(([x,y])=>px(x,y)))}));
 mursPxTache={formes,cle,polys};setTimeout(()=>{mursPxTache=null},0);
 return polys}
function controlled(i){return view==="mj"||i===owner}
// Le MJ peut figer la table : les joueurs regardent, les tokens ne bougent plus.
/* Le Gel cloue un combattant sur place ; comme pour le verrou des déplacements, le MJ passe outre :
   c'est lui qui arbitre, et il a souvent besoin de replacer un socle. Au sol, le token est verrouillé
   pour tous, MJ compris, tant que le combattant ne s'est pas relevé — ce qui lui coûte un Mouvement. */
function canMove(i){return controlled(i)&&!hasState(actors[i],'Au sol')&&(view==="mj"||(!tokensLocked&&!hasState(actors[i],'Gel')))}
/* Un dé d'effet ne se défend pas : ni DEF, ni blindage, ni saignée. Il se voit sur la
   carte et se raconte au journal, comme un jet d'attaque. Un état empilé en lance autant
   que de crans — trois crans de Feu, trois dés de brûlure — et c'est leur somme qui porte. */
function effectDice(a,couleur,crans){const jets=Array.from({length:Math.max(1,crans|0)},()=>d6());
 rollOnBoard(jets.map(v=>[v,couleur]),a,a);
 return {jets,total:jets.reduce((s,v)=>s+v,0)}}
// « Dé noir 4 » pour un seul cran, « dés noirs 4 + 2 + 5 = 11 » quand l'état s'est empilé.
function ditLesJets(nom,j){return j.jets.length<2?'dé '+nom+' '+j.total
 :'dés '+nom+'s '+j.jets.join(' + ')+' = '+j.total}
/* Des dégâts hors d'une attaque — opportunité, talent, état, piège : un Blindage les absorbe tous, puis
   disparaît, et le chiffre qui monte le dit. Renvoie ce qui est perdu, et si le Blindage a tout pris. */
/* ---------- Le bilan du combat ----------
   Chaque combattant tient ses chiffres du combat en cours — dégâts infligés et subis, PV soignés, distance,
   coups, critiques, adversaires mis à terre, plus gros coup — et les emporte sur la table en ligne : ils se
   comptent là où le geste a lieu. La fin du combat les fige dans la ligne du journal qui l'annonce. */
let auteurCoup=null,bilanPartis=[];
function ajouteBilan(a,k,n){if(!a||!(n>0)||!enCombat())return;if(!a.bilan||typeof a.bilan!=='object')a.bilan={};a.bilan[k]=(Number(a.bilan[k])||0)+n}
function compteDegats(de,vers,n){if(!(n>0)||!vers)return;ajouteBilan(vers,'sub',n);
 if(de&&de!==vers&&enCombat()){ajouteBilan(de,'inf',n);de.bilan.pic=Math.max(Number(de.bilan.pic)||0,n);if(vers.hp===0)ajouteBilan(de,'abat',1)}}

$('map').addEventListener('pointerdown',e=>{
 /* Le cadre ne part pas d'un socle ni d'une porte : c'est un geste sur le décor. Le
    garde-fou visait la seule balise « rect », du temps où toute porte en était une — une
    porte de biais est un polygone, et son clic partait donc dans le cadre au lieu de
    l'ouvrir. On désigne maintenant le calque des portes, quelle que soit leur forme. */
 if(e.target.closest('.token')||e.target.closest('#map-doors')||e.target.closest('#map-coffres'))return;
 // Bouton droit : panoramique. Bouton gauche : cadre de sélection.
 if(e.button===2){if(mapZoom<=1)return;
  panDrag={x:e.clientX,y:e.clientY};$('map').classList.add('panning');return}
 if(e.button!==0)return;
 cadre={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,bouge:false};
 $('map').setPointerCapture(e.pointerId)});
$('map').addEventListener('pointermove',e=>{if(!cadre)return;
 cadre.x=e.clientX;cadre.y=e.clientY;
 if(Math.abs(cadre.x-cadre.x0)>4||Math.abs(cadre.y-cadre.y0)>4)cadre.bouge=true;
 if(cadre.bouge)dessineCadre()});
$('map').addEventListener('pointerup',e=>{if(!cadre)return;
 // Un clic sur le décor repose ce qui était pris : c'est le geste qu'on fait sans y penser.
 const tracé=cadre.bouge;if(tracé)prendreDansCadre();else{$('marquee').hidden=true;leverSelection()}
 cadre=null;try{$('map').releasePointerCapture(e.pointerId)}catch(err){}});
$('map').addEventListener('contextmenu',e=>{if(!e.target.closest('.token'))e.preventDefault()});
$('map').addEventListener('pointerup',()=>{panDrag=null;$('map').classList.remove('panning')});
$('map').addEventListener('pointerleave',()=>{panDrag=null;$('map').classList.remove('panning');
 if(cadre){cadre=null;$('marquee').hidden=true}});
$('zoom-in').onclick=()=>zoomMapAt(1.25,$('map').clientWidth/2,$('map').clientHeight/2);
$('zoom-out').onclick=()=>zoomMapAt(1/1.25,$('map').clientWidth/2,$('map').clientHeight/2);
$('zoom-reset').onclick=resetMapZoom;
$('map').addEventListener('pointerleave',hideAim);
/* Les distances sur les flèches de ciblage : affichées ou non, au choix de chacun, MJ comme joueurs ; le choix vaut

let distancesOn=true;try{distancesOn=localStorage.getItem('amertume-distances')!=='0'}catch(e){}
function majDistances(){const b=$('distances-vue');$('aim').classList.toggle('sans-distances',!distancesOn);if(!b)return;
 b.classList.toggle('on',distancesOn);b.setAttribute('aria-pressed',String(distancesOn));
 b.title=distancesOn?'Masquer les distances sur les flèches de ciblage':'Afficher les distances sur les flèches de ciblage';b.setAttribute('aria-label',b.title)}
$('distances-vue').onclick=()=>{distancesOn=!distancesOn;try{localStorage.setItem('amertume-distances',distancesOn?'1':'0')}catch(e){}majDistances()};
majDistances();
$('portees').onclick=()=>{porteesOn=!porteesOn;
 localStorage.setItem('amertume-portees',porteesOn?'1':'0');majPortees();updateRing()};
